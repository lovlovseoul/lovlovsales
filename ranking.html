<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>여성의류 랭킹 트래커</title><!-- v2 -->
<style>
:root{
  --surface-0:#F4F5F7;--surface-1:#FFFFFF;--surface-2:#FAFBFC;--line:#E7E9ED;--line-2:#DCDFE4;
  --text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529;--accent-soft:#FDEEE9;--up:#1F8A5B;--down:#D64545;--own:#F2A93B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:28px 26px 70px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
header{margin-bottom:6px}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.6}
.sub b{color:var(--text-1)}
.months{display:inline-flex;gap:4px;flex-wrap:wrap;margin:14px 0 2px;background:var(--surface-1);padding:4px;border:1px solid var(--line);border-radius:12px}
.mtab{padding:8px 20px;border-radius:8px;background:none;color:var(--text-2);border:none;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.mtab.on{background:var(--accent);color:#fff}
.scope{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}
.chip{padding:6px 11px;border-radius:8px;background:var(--surface-1);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ctrl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.ctrl input[type=search]{flex:1 1 240px;min-width:0;font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-1);color:var(--text-1)}
.ctrl label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text-2);cursor:pointer}
.note{color:var(--text-3);font-size:11.5px;margin:0 0 12px;line-height:1.5}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:14px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sorts{display:flex;gap:5px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:980px){.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 10px}
.tile{display:flex;flex-direction:column;gap:4px;color:var(--text-1);text-decoration:none;min-width:0}
.ph{position:relative;aspect-ratio:5/6;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ni{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:11px}
.tile.own .ph{outline:3px solid var(--own);outline-offset:-3px}
.badge{position:absolute;top:6px;left:6px;display:flex;gap:4px;align-items:center}
.badge .no{background:var(--text-1);color:#fff;font-weight:700;font-size:12px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.badge .ch{background:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px}
.sold{position:absolute;bottom:6px;right:6px;background:#fff;color:var(--text-2);font-size:11px;padding:2px 6px;border-radius:999px}
.br{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:12px;color:var(--text-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.pr .cu{font-size:11px;color:var(--text-3);text-decoration:line-through}
.pr .dc{font-size:13px;font-weight:700;color:var(--accent)}
.pr .fi{font-size:13px;font-weight:700}
.meta{font-size:11px;color:var(--text-3)}
.up{color:var(--up)}.down{color:var(--down)}.nw{color:var(--accent)}.mu{color:var(--text-3)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:42px 2.4rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);color:var(--text-1);text-decoration:none;font-size:12px}
.li:last-child{border-bottom:none}
.li img,.li .nii{width:42px;height:50px;object-fit:cover;border-radius:5px;background:var(--surface-2);display:block}
.li .rk{text-align:center;font-weight:700;line-height:1.2}
.li .rk small{display:block;font-size:11px}
.li .tx{min-width:0}
.li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{display:block;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .p{text-align:right;white-space:nowrap}
.li .p i{font-style:normal;color:var(--accent);font-weight:700;margin-right:4px}
.li.own{background:#FFF6E8}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 2rem;gap:8px;align-items:center;font-size:12px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:9px;background:var(--surface-0);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--text-3);border-radius:5px}
.bar.own .fill{background:var(--own)}
.bar .n{text-align:right;font-weight:600}
.empty{color:var(--text-3);font-size:12px;padding:8px 0}
#trend svg{width:100%;height:auto;display:block}
#trend text{font-size:11px;fill:var(--text-3)}
@media(max-width:820px){body{padding:20px 14px 56px}}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.sitenav{display:inline-flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}.sitenav a{text-decoration:none;font-size:13px;font-weight:700;padding:7px 16px;border-radius:7px;color:var(--text-2)}.sitenav a:hover{color:var(--text-1)}.sitenav a.on{background:var(--text-1);color:#fff}
</style></head>
<body><div class="wrap">
<div class="topbar"><nav class="sitenav"><a href="index.html">판매</a><a href="returns.html">반품</a><a href="ranking.html" class="on">랭킹</a></nav></div>
<header>
<h1>여성의류 랭킹 트래커</h1>
<div class="sub" id="take">불러오는 중…</div>
</header>
<div class="months" id="plats"></div>
<div class="scope" id="cats"></div>
<div class="ctrl">
  <input type="search" id="q" placeholder="브랜드·상품명 검색 (이 플랫폼 전체 카테고리)" aria-label="브랜드·상품명 검색">
  <label><input type="checkbox" id="own"> 로브로브·레세터만</label>
  <label><input type="checkbox" id="allb"> SPA·스포츠·명품 포함 전체 순위</label>
</div>
<p class="note" id="snapnote"></p>

<section class="card" id="searchCard" hidden>
  <h3>검색 결과</h3><div class="cs">검색어가 들어간 상품의 현재 순위 · 이 플랫폼 모든 카테고리</div>
  <div class="tiles" id="searchTiles"></div><div class="empty" id="searchEmpty"></div>
  <h3 style="margin-top:18px">순위 추이</h3><div class="cs">검색 결과 상위 5개 · 위로 갈수록 높은 순위</div>
  <div id="trend"></div>
</section>

<section class="card">
  <div class="chead">
    <div><h3>카테고리 랭킹 TOP100</h3><div class="cs" id="mainNote"></div></div>
    <div class="sorts" id="sorts">
      <button class="chip on" data-s="rank">순위순</button><button class="chip" data-s="rise">상승폭순</button><button class="chip" data-s="price">가격 낮은순</button><button class="chip" data-s="dc">할인율 높은순</button>
    </div>
  </div>
  <div class="tiles" id="main"></div><div class="empty" id="mainEmpty"></div>
</section>

<div class="grid3">
  <section class="card"><h3>급상승 TOP 10</h3><div class="cs">전날보다 순위가 가장 많이 오른 상품</div><div class="list" id="risers"></div><div class="empty" id="risersEmpty"></div></section>
  <section class="card"><h3>신규 진입</h3><div class="cs">전날 순위권에 없던 상품</div><div class="list" id="news"></div><div class="empty" id="newsEmpty"></div></section>
  <section class="card"><h3>브랜드 점유</h3><div class="cs">지금 보는 TOP100 안의 브랜드별 상품 수 · 상위 12개</div><div class="bars" id="brands"></div></section>
</div>
</div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'–':Number(n).toLocaleString('ko-KR');
const won=n=>n==null||n===''?'–':'₩'+fmt(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[],H=[];
try{
  const v='?v='+Date.now();
  [L,H]=await Promise.all([fetch('rank_latest.json'+v).then(r=>r.json()),fetch('rank_history.json'+v).then(r=>r.json()).catch(()=>[])]);
}catch(e){$('take').textContent='랭킹 데이터를 불러오지 못했어요.';return;}
const ST={plat:null,cat:null,q:'',own:false,allb:false,sort:'rank'};
try{Object.assign(ST,JSON.parse(localStorage.getItem('rk_state')||'{}'));}catch(e){}
ST.q='';
const save=()=>{try{localStorage.setItem('rk_state',JSON.stringify({plat:ST.plat,cat:ST.cat,own:ST.own,allb:ST.allb,sort:ST.sort}))}catch(e){}};
const plats=[...new Set(L.map(r=>r.platform))];
const cats=p=>[...new Set(L.filter(r=>r.platform===p).map(r=>r.cat))];
const cur=()=>{const p=plats.includes(ST.plat)?ST.plat:plats[0];const cs=cats(p);return{p,c:cs.includes(ST.cat)?ST.cat:cs[0]}};
const dm=()=>!ST.allb;
const num=v=>v==null||v===''?null:Number(v);
const inView=r=>dm()?num(r.drank)!==null:num(r.rank)<=100;
const RK=r=>dm()?num(r.drank):num(r.rank);
const CHG=r=>num(dm()?r.dchange:r.change);
const BEST=r=>dm()?(r.dbest7??r.drank):r.best7;
const own=r=>r.own===true;
const chg=r=>{if(r.status==='신규')return['NEW','nw'];const c=CHG(r);if(!c)return['–','mu'];return c>0?['▲'+c,'up']:['▼'+(-c),'down']};
const img=(r,cls)=>r.img?`<img src="${esc(r.img)}" alt="" loading="lazy" referrerpolicy="no-referrer"${cls?` class="${cls}"`:''} onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'${cls?'nii':'ni'}',textContent:'${cls?'':'이미지 없음'}'}))">`:`<span class="${cls?'nii':'ni'}"></span>`;
const tile=(r,meta)=>{const[ct,cc]=chg(r);const cu=num(r.cust),fi=num(r.price),dc=num(r.sale);
  return `<a class="tile${own(r)?' own':''}" href="${esc(r.url)}" target="_blank" rel="noopener"><div class="ph">${img(r)}<div class="badge"><span class="no">${RK(r)}</span>${ct!=='–'?`<span class="ch ${cc}">${ct}</span>`:''}</div>${r.soldout?'<span class="sold">품절</span>':''}</div>
  <div class="br">${esc(r.brand)}</div><div class="nm">${esc(r.name)}</div>
  <div class="pr">${cu&&fi&&cu>fi?`<span class="cu">${won(cu)}</span>`:''}${dc?`<span class="dc">${dc}%</span>`:''}<span class="fi">${won(fi)}</span></div>
  <div class="meta">${meta??((dm()&&r.platform==='무신사'?`무신사 전체 ${r.rank}위 · `:'')+(r.snap?'스냅샷':`7일 최고 ${BEST(r)}위 · ${r.days}일째`))}</div></a>`};
const line=r=>{const[ct,cc]=chg(r);const dc=num(r.sale);
  return `<a class="li${own(r)?' own':''}" href="${esc(r.url)}" target="_blank" rel="noopener">${img(r,'t')}<div class="rk">${RK(r)}<small class="${cc}">${ct}</small></div><div class="tx"><b>${esc(r.brand)}</b><span>${esc(r.name)}</span></div><div class="p">${dc?`<i>${dc}%</i>`:''}${won(r.price)}</div></a>`};
const sorters={rank:(a,b)=>RK(a)-RK(b),rise:(a,b)=>(CHG(b)??-999)-(CHG(a)??-999)||RK(a)-RK(b),price:(a,b)=>(num(a.price)??1e12)-(num(b.price)??1e12),dc:(a,b)=>(num(b.sale)??0)-(num(a.sale)??0)||RK(a)-RK(b)};
function render(){
  const{p,c}=cur();save();
  $('plats').innerHTML=plats.map(x=>`<button class="mtab${x===p?' on':''}" data-p="${esc(x)}">${esc(x)}</button>`).join('');
  $('cats').innerHTML=cats(p).map(x=>`<button class="chip${x===c?' on':''}" data-c="${esc(x)}">${esc(x)}</button>`).join('');
  $('own').checked=ST.own;$('allb').checked=ST.allb;
  document.querySelectorAll('#sorts .chip').forEach(b=>b.classList.toggle('on',b.dataset.s===ST.sort));
  const PL=L.filter(r=>r.platform===p), first=PL[0]||{};
  let cl=PL.filter(r=>r.cat===c&&inView(r));
  const nNew=cl.filter(r=>r.status==='신규').length,nOwn=cl.filter(own).length;
  $('take').innerHTML=`<b>${esc(first.date||'')}</b> ${first.snap?'스냅샷':'일간 랭킹'} · <b>${esc(p)} ${esc(c)}</b> ${dm()?'디자이너 브랜드':'전체 브랜드'} TOP100 · 신규 진입 <b>${nNew}</b>개 · 로브로브·레세터 <b>${nOwn}</b>개`;
  $('snapnote').textContent=first.snap?`${p} 순위는 ${first.date}에 크롬으로 한 번 받아 둔 스냅샷이에요 (매일 자동 갱신은 무신사만). 디자이너 브랜드만 담겨 있어요.`:'무신사는 매일 오전 자동 갱신 · 디자이너 브랜드 순위는 SPA·스포츠·아웃도어·골프·라이선스 캐주얼·수입 명품을 뺀 뒤 다시 매긴 순위예요.';
  $('mainNote').textContent=(dm()?'배지는 디자이너 브랜드 안 순위와 전날 대비 변동':'배지는 플랫폼 전체 순위와 전날 대비 변동')+' · 가격은 할인 적용가 · 카드를 누르면 상품 페이지가 열려요';
  let ml=ST.own?cl.filter(own):cl.slice();ml.sort(sorters[ST.sort]||sorters.rank);
  $('main').innerHTML=ml.map(r=>tile(r)).join('');
  $('mainEmpty').textContent=ml.length?'':(ST.own?'이 카테고리 TOP100에 로브로브·레세터 상품이 없어요.':'이 카테고리 데이터가 없어요.');
  const ris=cl.filter(r=>(CHG(r)??0)>0).sort((a,b)=>CHG(b)-CHG(a)).slice(0,10);
  $('risers').innerHTML=ris.map(line).join('');
  $('risersEmpty').textContent=first.snap?'스냅샷 한 번뿐이라 변동은 없어요.':first.status==='첫 수집'?'수집 첫날이라 내일부터 표시돼요.':(ris.length?'':'오른 상품이 없어요.');
  const nw=cl.filter(r=>r.status==='신규').sort((a,b)=>RK(a)-RK(b));
  $('news').innerHTML=nw.map(line).join('');
  $('newsEmpty').textContent=first.snap?'스냅샷 한 번뿐이라 신규 진입은 없어요.':first.status==='첫 수집'?'수집 첫날이라 내일부터 표시돼요.':(nw.length?'':'새로 들어온 상품이 없어요.');
  const bm=new Map();cl.forEach(r=>{const o=bm.get(r.brand)||{b:r.brand,n:0,own:own(r)};o.n++;bm.set(r.brand,o)});
  const bl=[...bm.values()].sort((a,b)=>b.n-a.n).slice(0,12),mx=bl[0]?bl[0].n:1;
  $('brands').innerHTML=bl.map(x=>`<div class="bar${x.own?' own':''}"><span class="lab">${esc(x.b)}</span><span class="trk"><span class="fill" style="display:block;width:${x.n/mx*100}%"></span></span><span class="n">${x.n}</span></div>`).join('');
  // search
  const q=ST.q.trim().toLowerCase();$('searchCard').hidden=!q;
  if(q){
    let m=PL.filter(r=>inView(r)&&(r.brand+' '+r.name).toLowerCase().includes(q));if(ST.own)m=m.filter(own);
    m.sort((a,b)=>RK(a)-RK(b)||a.cat.localeCompare(b.cat));
    $('searchTiles').innerHTML=m.slice(0,60).map(r=>tile(r,r.cat+(r.snap?' · 스냅샷':' · 7일 최고 '+BEST(r)+'위'))).join('');
    $('searchEmpty').textContent=m.length?'':'검색어가 들어간 상품이 순위권 안에 없어요.';
    drawTrend(m);
  }
}
function drawTrend(m){
  const box=$('trend');const seen=new Set(),pick=[];
  for(const r of m){if(!seen.has(r.key)){seen.add(r.key);pick.push(r)}if(pick.length===5)break}
  const S=pick.map(r=>({r,pts:H.filter(h=>h.platform===r.platform&&h.cat===r.cat&&h.id===r.id&&(!dm()||h.drank!=null)).map(h=>({d:h.date,v:Number(dm()?h.drank:h.rank)})).sort((a,b)=>a.d<b.d?-1:1)})).filter(s=>s.pts.length);
  if(!S.length){box.innerHTML='<div class="empty">—</div>';return}
  const dates=[...new Set(S.flatMap(s=>s.pts.map(p=>p.d)))].sort();
  const W=Math.max(320,box.clientWidth||700),Hh=220,ml=34,mr=12,mt=12,mb=26;
  const ymax=Math.max(10,...S.flatMap(s=>s.pts.map(p=>p.v)));
  const x=d=>dates.length===1?(ml+W-mr)/2:ml+(W-ml-mr)*dates.indexOf(d)/(dates.length-1);
  const y=v=>mt+(Hh-mt-mb)*(v-1)/(ymax-1);
  const C=['#EA5529','#2F6FEB','#1F8A5B','#8E44AD','#D4A017'];
  let g='';
  [1,Math.round(ymax/2),ymax].forEach(t=>{g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}" stroke="#E7E9ED"/><text x="${ml-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`});
  const step=Math.ceil(dates.length/6);dates.forEach((d,i)=>{if(i%step===0||i===dates.length-1)g+=`<text x="${x(d)}" y="${Hh-6}" text-anchor="middle">${d.slice(5).replace('-','/')}</text>`});
  S.forEach((s,i)=>{const pts=s.pts.map(p=>`${x(p.d)},${y(p.v)}`).join(' ');g+=`<polyline fill="none" stroke="${C[i]}" stroke-width="2" stroke-linejoin="round" points="${pts}"/>`+s.pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3" fill="${C[i]}"/>`).join('')});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}">${g}</svg><div class="note" style="margin-top:6px">${S.map((s,i)=>`<span style="color:${C[i]}">●</span> ${esc(s.r.brand)} ${esc(s.r.name.slice(0,18))} (${esc(s.r.cat)})`).join(' &nbsp;·&nbsp; ')}</div>`;
}
$('plats').onclick=e=>{const b=e.target.closest('[data-p]');if(b){ST.plat=b.dataset.p;ST.cat=null;render()}};
$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){ST.cat=b.dataset.c;render()}};
$('sorts').onclick=e=>{const b=e.target.closest('[data-s]');if(b){ST.sort=b.dataset.s;render()}};
$('own').onchange=e=>{ST.own=e.target.checked;render()};
$('allb').onchange=e=>{ST.allb=e.target.checked;render()};
let t;$('q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{ST.q=e.target.value;render()},250)};
render();
})();
</script>
