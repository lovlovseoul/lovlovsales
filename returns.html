<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로브로브 반품 대시보드</title>
<style>
:root{
  --surface-0:#F4F5F7;--surface-1:#FFFFFF;--surface-2:#FAFBFC;--line:#E7E9ED;--line-2:#DCDFE4;
  --text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529;--accent-soft:#FDEEE9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:28px 26px 70px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
header{margin-bottom:6px}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.6}
.tabs{display:flex;gap:7px;margin:18px 0 6px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:999px;background:var(--surface-1);color:var(--text-2);border:1px solid var(--line-2);cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s}
.tab:hover{border-color:var(--text-3)}
.tab.on{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.tab.dis{opacity:.45;cursor:not-allowed}
.months{display:inline-flex;gap:4px;flex-wrap:wrap;margin:14px 0 2px;background:var(--surface-1);padding:4px;border:1px solid var(--line);border-radius:12px}
.mtab{padding:8px 20px;border-radius:8px;background:none;color:var(--text-2);border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
.mtab.on{background:var(--accent);color:#fff}
.scope{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.chip{padding:6px 11px;border-radius:8px;background:var(--surface-1);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;transition:.12s}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpi .lab{color:var(--text-2);font-size:12px;font-weight:500}
.kpi .val{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.kpi .sub2{color:var(--text-3);font-size:11px;margin-top:5px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
th{color:var(--text-3);font-weight:600;font-size:11px}
td{color:var(--text-1);font-weight:600}
td.n,th.n{text-align:left}
tr:last-child td{border-bottom:none}
.rank{color:var(--text-3);width:22px;display:inline-block;font-weight:600}
tr.clk{cursor:pointer}tr.clk:hover{background:#F4F5F7}
.rsn{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.crow{margin:8px 0}
.cline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;font-weight:500}
.cq{color:var(--text-2);white-space:nowrap;padding-left:10px}
.cbarwrap{height:7px;background:#EEF0F3;border-radius:4px;overflow:hidden}
.cbar{height:100%;border-radius:4px}
.det{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;color:var(--text-1);line-height:1.5}
.det .dm{color:var(--text-2);font-size:11px;margin-bottom:3px;font-weight:500}
svg text{font-family:inherit}
.tip{position:fixed;pointer-events:none;background:#1A1D21;border:none;border-radius:8px;padding:8px 11px;font-size:12px;color:#fff;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap;box-shadow:0 6px 18px rgba(16,24,40,.18)}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:16px 16px 14px;min-width:270px;max-width:360px;max-height:82vh;overflow:auto;box-shadow:0 10px 30px rgba(16,24,40,.14);font-size:13px}
.pop h4{font-size:14px;margin:0 22px 2px 0;font-weight:700}.pop .psub{font-size:11px;color:var(--text-3);margin-bottom:10px}
.pop .seclab{font-size:10.5px;letter-spacing:.02em;color:var(--text-3);margin:12px 0 6px}
.pop .pclose{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--text-3)}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}body{padding:20px 14px 56px}}
</style></head>

  const ents=Object.keys(obj).map(k=>[k,obj[k]]).sort((a,b)=>b[1]-a[1]);
  const tot=ents.reduce((s,e)=>s+e[1],0)||1;
  return ents.map(e=>{const pct=Math.round(e[1]/tot*100);return '<div class="crow"><div class="cline"><span>'+e[0]+'</span><span class="cq">'+e[1]+'장 · '+pct+'%</span></div><div class="cbarwrap"><div class="cbar" style="width:'+pct+'%;background:'+(colorFn?colorFn(e[0]):'var(--accent)')+'"></div></div></div>';}).join('');
}
function showPop(t,e){
  const pop=document.getElementById('pop');
  let h='<span class="pclose" onclick="document.getElementById(\'pop\').hidden=true">✕</span><h4>'+t.name+'</h4><div class="psub">'+scopeLabel()+' · 반품 '+t.qty+'장 · '+won(t.amt)+'</div>';
  h+='<div class="seclab">사유별</div>'+bars2(t.reason,rc);
  h+='<div class="seclab">옵션별</div>'+bars2(t.opt,null);
  if(t.det&&t.det.length){h+='<div class="seclab">고객 사유상세</div>'+t.det.map(d=>'<div class="det"><div class="dm">'+md(d.date)+' · '+d.opt+' · '+d.reason+'</div>'+esc(d.text)+'</div>').join('');}
  pop.innerHTML=h; pop.hidden=false;
  const pw=pop.offsetWidth,ph=pop.offsetHeight;
  pop.style.left=Math.max(8,Math.min((e.clientX||100)+12,innerWidth-pw-12))+'px';
  pop.style.top=Math.max(8,Math.min((e.clientY||100)+12,innerHeight-ph-12))+'px';
}
document.addEventListener('click',e=>{const pop=document.getElementById('pop');if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('tr.clk'))pop.hidden=true;});
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.opacity=0;}
render();
</script>
