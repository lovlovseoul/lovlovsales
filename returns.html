<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로브로브 반품 대시보드</title>
<style>
:root{
  --surface-0:#0f0f0e;--surface-1:#1a1a19;--surface-2:#232322;--line:#333330;
  --text-1:#fff;--text-2:#c3c2b7;--text-3:#8a897f;--accent:#c56b5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:'Segoe UI',Arial,'Malgun Gothic',sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
header{margin-bottom:16px}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--text-3);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px;background:var(--surface-1);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--text-1);color:#000;border-color:var(--text-1)}
.tab.dis{opacity:.4;cursor:not-allowed}
.scope{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chip{padding:6px 11px;border-radius:8px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;transition:.12s}
.chip:hover{background:#2c2c2a}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .lab{color:var(--text-3);font-size:12px;font-weight:600}
.kpi .val{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .sub2{color:var(--text-3);font-size:11px;margin-top:3px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--text-3);font-weight:600;font-size:11px}
td.n,th.n{text-align:left}
tr:last-child td{border-bottom:none}
.rank{color:var(--text-3);width:22px;display:inline-block}
tr.clk{cursor:pointer}tr.clk:hover{background:rgba(255,255,255,.05)}
.rsn{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.crow{margin:8px 0}
.cline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.cq{color:var(--text-2);white-space:nowrap;padding-left:10px}
.cbarwrap{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.cbar{height:100%;border-radius:4px}
.det{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;color:var(--text-1);line-height:1.5}
.det .dm{color:var(--text-3);font-size:11px;margin-bottom:3px}
svg text{font-family:inherit}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:#fff;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap}
.pop{position:fixed;z-index:60;background:#141412;border:1px solid #3a3a34;border-radius:12px;padding:16px 16px 14px;min-width:270px;max-width:360px;max-height:82vh;overflow:auto;box-shadow:0 10px 34px rgba(0,0,0,.6);font-size:13px}
.pop h4{font-size:14px;margin:0 22px 2px 0}.pop .psub{font-size:11px;color:var(--text-3);margin-bottom:10px}
.pop .seclab{font-size:10.5px;letter-spacing:.04em;color:var(--text-3);margin:12px 0 6px}
.pop .pclose{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--text-3)}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}body{padding:16px}}
</style></head>

    bars+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(0,bh)+'" rx="3" fill="var(--accent)" class="tb" data-t="'+md(d)+'" data-v="'+v+'장 · '+won(dt[d]?dt[d].amt:0)+'"></rect>';
    bars+='<text x="'+x+'" y="'+(H-9)+'" fill="var(--text-3)" font-size="10" text-anchor="middle">'+md(d)+'</text>';
    if(v)bars+='<text x="'+x+'" y="'+(y-4)+'" fill="var(--text-2)" font-size="10" text-anchor="middle">'+v+'</text>';});
  return '<div class="card"><h3>일별 반품 추이</h3><div class="cs">반품접수일 · 일별 수량(막대) · 마우스 올리면 금액</div><div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+bars+'</svg></div></div>';
}
function topCard(S){
  const list=(S.top||[]).slice(0,15); const tot=list.reduce((s,t)=>s+t.amt,0)||1;
  let rows=list.map((t,ix)=>{
    const rmix=reasonsSorted(t.reason).slice(0,3).map(r=>'<span class="rsn" style="background:'+rc(r)+';font-size:9.5px;padding:1px 5px">'+r+' '+t.reason[r]+'</span>').join(' ');
    return '<tr class="clk" data-i="'+ix+'"><td class="n"><span class="rank">'+(ix+1)+'</span>'+t.name+'</td><td>'+t.qty+'장</td><td>'+won(t.amt)+'</td><td class="n" style="text-align:left">'+rmix+'</td></tr>';}).join('');
  return '<div class="card"><h3>반품 TOP 상품</h3><div class="cs">'+(scope==="전체"?'기간 전체':md(scope))+' · 금액순 · 행 클릭 → 사유·옵션·고객사유 상세</div><table><tr><th class="n">순위 · 상품</th><th>수량</th><th>반품액</th><th class="n" style="text-align:left">주요 사유</th></tr>'+rows+'</table></div>';
}
function detailCard(S){
  let dets=[];
  (S.top||[]).forEach(t=>{(t.det||[]).forEach(d=>dets.push(Object.assign({name:t.name},d)));});
  dets.sort((a,b)=>a.date<b.date?1:-1);
  if(!dets.length) return '';
  let h=dets.map(d=>'<div class="det"><div class="dm">'+md(d.date)+' · '+d.name+' · '+d.opt+' · <span class="rsn" style="background:'+rc(d.reason)+';font-size:9.5px">'+d.reason+'</span></div>'+esc(d.text)+'</div>').join('');
  return '<div class="card"><h3>고객 사유 상세 (불량·파손)</h3><div class="cs">'+(scope==="전체"?'기간 전체':md(scope))+' · 고객이 직접 입력한 사유 '+dets.length+'건</div>'+h+'</div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function bindTop(S){
  document.querySelectorAll('#views tr.clk').forEach(tr=>{tr.onclick=e=>{showPop(S.top[+tr.dataset.i],e);};});
  document.querySelectorAll('#views .tb').forEach(el=>{
    el.addEventListener('mousemove',e=>showTip(e,'<b>'+el.dataset.t+'</b><br>'+el.dataset.v));
    el.addEventListener('mouseleave',hideTip);});
}
function bars2(obj,colorFn){
  const ents=Object.keys(obj).map(k=>[k,obj[k]]).sort((a,b)=>b[1]-a[1]);
  const tot=ents.reduce((s,e)=>s+e[1],0)||1;
  return ents.map(e=>{const pct=Math.round(e[1]/tot*100);return '<div class="crow"><div class="cline"><span>'+e[0]+'</span><span class="cq">'+e[1]+'장 · '+pct+'%</span></div><div class="cbarwrap"><div class="cbar" style="width:'+pct+'%;background:'+(colorFn?colorFn(e[0]):'var(--accent)')+'"></div></div></div>';}).join('');
}
function showPop(t,e){
  const pop=document.getElementById('pop');
  let h='<span class="pclose" onclick="document.getElementById(\'pop\').hidden=true">✕</span><h4>'+t.name+'</h4><div class="psub">'+(scope==="전체"?'기간 전체':md(scope))+' · 반품 '+t.qty+'장 · '+won(t.amt)+'</div>';
  h+='<div class="seclab">사유별</div>'+bars2(t.reason,rc);
  h+='<div class="seclab">옵션별</div>'+bars2(t.opt,null);
  if(t.det&&t.det.length){h+='<div class="seclab">고객 사유상세</div>'+t.det.map(d=>'<div class="det"><div class="dm">'+md(d.date)+' · '+d.opt+' · '+d.reason+'</div>'+esc(d.text)+'</div>').join('');}
  pop.innerHTML=h; pop.hidden=false;
  const pw=pop.offsetWidth,ph=pop.offsetHeight;
  pop.style.left=Math.max(8,Math.min((e.clientX||100)+12,innerWidth-pw-12))+'px';
  pop.style.top=Math.max(8,Math.min((e.clientY||100)+12,innerHeight-ph-12))+'px';
}
document.addEventListener('click',e=>{const pop=document.getElementById('pop');if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('tr.clk'))pop.hidden=true;});
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.opacity=0;}
render();
</script>
</body></html>
