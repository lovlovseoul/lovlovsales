<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><title>필로우북 매뉴얼</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>필로우북 매뉴얼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
/* Layout: 그룹웨어 오피스톤 — 왼쪽 고정 목차(장 › 항목) · 본문은 한 번에 한 페이지 · 아래 이전/다음 */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --line:#E7E9ED; --line2:#D9DDE3;
  --ink:#1A1D21; --ink2:#5B6470; --ink3:#9AA3AD;
  --accent:#EA5529; --accent-tint:#FDEEE9; --accent-ink:#B83D18;
  --good:#16A34A; --good-tint:#E8F6EC; --warn:#C27C0E; --warn-tint:#FDF3E1;
  --info:#2563EB; --info-tint:#EAF1FE;
  --side:#FFFFFF; --hover:#F0F2F5; --shadow:0 1px 2px rgba(20,24,30,.05),0 1px 1px rgba(20,24,30,.03);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --card:#1B1E23; --line:#2A2F36; --line2:#363C45;
  --ink:#ECEEF1; --ink2:#A6AEB8; --ink3:#6F7884;
  --accent:#F2714B; --accent-tint:#3A2219; --accent-ink:#F7A48A;
  --good:#3FBF6B; --good-tint:#16301F; --warn:#E3A33A; --warn-tint:#33280F;
  --info:#6E9BF7; --info-tint:#18233A;
  --side:#171A1E; --hover:#23272D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --card:#1B1E23; --line:#2A2F36; --line2:#363C45;
  --ink:#ECEEF1; --ink2:#A6AEB8; --ink3:#6F7884;
  --accent:#F2714B; --accent-tint:#3A2219; --accent-ink:#F7A48A;
  --good:#3FBF6B; --good-tint:#16301F; --warn:#E3A33A; --warn-tint:#33280F;
  --info:#6E9BF7; --info-tint:#18233A;
  --side:#171A1E; --hover:#23272D; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--info);font-weight:600;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}

/* 사이드바 */
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:15}
.logo{padding:20px 20px 12px;display:flex;flex-direction:column;gap:2px;border:0;background:none;text-align:left}
.logo b{font-size:17px;letter-spacing:.02em}
.logo span{font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.grp{padding:6px 10px 8px}
.grp h3{margin:8px 10px 4px;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.nav{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;color:var(--ink2);font-size:13.5px}
.nav .no{font-family:var(--mono);font-size:11.5px;color:var(--ink3);min-width:26px;flex:none}
.nav .nm{flex:1;min-width:0}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none;align-self:center}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink);font-weight:700}
.nav[aria-current="page"] .no{color:var(--accent-ink)}
.part{margin:14px 20px 0;padding-top:12px;border-top:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent-ink)}
.tocpart{padding:16px 18px 4px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent-ink);border-top:1px solid var(--line);margin-top:6px}
.tocpart:first-child{border-top:0;margin-top:0}
.sidefoot{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;gap:2px}

.mtop{display:none}
.main{min-width:0}
.page{padding-block:28px 64px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));max-width:980px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* 페이지 머리 */
.crumb{font-size:12px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb i{font-style:normal;color:var(--line2)}
.dh{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.dh h1{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.dh h1 .no{font-family:var(--mono);font-size:18px;color:var(--accent)}
.dh p{margin:0;color:var(--ink2);font-size:13.5px;max-width:70ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink3)}
.meta b{color:var(--ink2);font-weight:600}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card>header h2{margin:0;font-size:14.5px;font-weight:700;margin-right:auto}
.card>header h2 .no{font-family:var(--mono);color:var(--ink3);font-weight:600;margin-right:8px;font-size:12.5px}
.card .body{padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lede{margin:0;color:var(--ink2);font-size:13.5px;max-width:72ch}
ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
ul.list li::marker{color:var(--ink3)}
ul.list li b{font-weight:700}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13.5px}
.dl dt{color:var(--ink3);font-size:12.5px;padding-top:1px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* 상태 표시 */
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-info{background:var(--info-tint);color:var(--info)}
.p-good{background:var(--good-tint);color:var(--good)}
.p-mute{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.p-acc{background:var(--accent-tint);color:var(--accent-ink)}
.todo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1.5px dashed color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-tint) 55%,var(--card));border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink2)}
.todo.inline{display:inline-flex;padding:2px 8px;border-width:1px;font-size:12.5px}
.chk{display:inline-flex;align-items:center;gap:6px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--info-tint);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);border-radius:10px;padding:11px 14px;font-size:13px}
.notice b{color:var(--info);flex:none}

/* 표 */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--bg)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.code{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;font-family:var(--mono);font-size:20px;font-weight:700}
.seg span{padding:4px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.seg span.hl{background:var(--accent-tint);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-ink)}
tr.go{cursor:pointer} tr.go:hover td{background:var(--hover)}
.gl td:first-child{width:32%;min-width:120px}
.gl td b{font-weight:700}
.gl .sub{font-size:11.5px;color:var(--ink3);font-weight:500}
.ex{font-size:12.5px;color:var(--ink2);margin-top:5px;padding-left:9px;border-left:2px solid var(--line2)}
.gltools{display:flex;flex-direction:column;gap:10px}
.gltools input{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:13.5px;width:100%;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.chips button:hover{border-color:var(--ink3);color:var(--ink)}
.calc{display:flex;flex-direction:column;gap:6px;background:var(--warn-tint);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:12px 14px;font-size:13px}
.calc b{color:var(--warn)}
ol.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.sub3{margin:4px 0 0;font-size:13.5px;font-weight:700}
.shot{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.shot img{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%;height:auto}
.shot figcaption{font-size:12px;color:var(--ink3)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.quote{border-left:3px solid var(--line2);padding:6px 12px;color:var(--ink2);font-size:13px;background:var(--bg);border-radius:0 8px 8px 0}
.notice.warn{background:var(--warn-tint);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.warn b{color:var(--warn)}
.step.static{cursor:default}
.btn-go{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-tint);color:var(--accent-ink);border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:700}
.btn-go:hover{background:var(--accent);color:#fff}
.snapsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.snapsteps .step img{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%;height:auto;margin-top:4px}
.tpl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tpl header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tpl header b{font-size:13.5px;margin-right:auto}
.tpl header button{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600}
.tpl .txt{padding:12px 14px;font-size:13.5px;white-space:pre-wrap;line-height:1.7}
.tpl .txt i{font-style:normal;background:var(--warn-tint);color:var(--warn);border-radius:4px;padding:0 3px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.phase{display:flex;flex-direction:column;gap:8px}
.phase h3{margin:0;font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.phase h3 span{font-family:var(--mono);color:var(--accent)}
.who{display:flex;flex-wrap:wrap;gap:4px}

/* 표지 */
.cover{padding:44px 40px 36px;display:flex;flex-direction:column;gap:22px;border-top:6px solid var(--ink)}
.cover .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--ink3);font-weight:700}
.cover h1{margin:0;font-size:34px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.cover h1 small{display:block;font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:8px}
.stamp{align-self:flex-start;border:2px solid var(--accent);color:var(--accent);border-radius:6px;padding:3px 10px;font-weight:800;font-size:13px;letter-spacing:.12em;transform:rotate(-3deg)}

/* 목차 */
.tocg{display:flex;flex-direction:column}
.tocg h3{margin:0;padding:12px 18px 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.tocg h3 .no{font-family:var(--mono);color:var(--accent)}
.tocrow{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 18px 7px 34px;font-size:13.5px}
.tocrow:hover{background:var(--hover)}
.tocrow .no{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:30px;flex:none}
.tocrow .nm{flex:none;max-width:60%}
.tocrow .lead{flex:1;border-bottom:1.5px dotted var(--line2);transform:translateY(-4px);min-width:16px}
.tocrow .pg{font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none}

/* 업무 흐름 */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:st}
.step{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.step .n{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:700}
.step b{font-size:13.5px}
.step p{margin:0;font-size:12.5px;color:var(--ink2)}
.step .who{align-self:flex-start}
.step.link{cursor:pointer;text-align:left;font:inherit;color:inherit}
.step.link:hover{border-color:var(--accent)}

/* 이전/다음 */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pager button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pager button:hover{border-color:var(--ink3)}
.pager button.nx{text-align:right;align-items:flex-end}
.pager small{font-size:11.5px;color:var(--ink3)}
.pager b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px}

@media (max-width:860px){.app{grid-template-columns:220px minmax(0,1fr)}.page{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}}
@media (max-width:680px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;height:auto;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,15,.35)}
  .mtop{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
  .mtop button{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600}
  .mtop b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cover{padding:28px 20px}
  .cover h1{font-size:26px}
  .dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .dl dd{margin-bottom:8px}
  .tocrow{padding-left:22px}
  .tocrow .nm{max-width:none;flex:1}
  .tocrow .lead{display:none}
  .pager{grid-template-columns:1fr}
  .pager button.nx{text-align:left;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" aria-label="목차">
    <button type="button" class="logo" id="logo"><b>PILLOWBOOK</b><span>OPERATIONS MANUAL</span></button>
    <nav id="nav"></nav>
    <div class="sidefoot"><span id="sideVer"></span><span>필로우북 · 로브로브 · 레세터</span></div>
  </aside>
  <div class="main">
    <div class="mtop"><button type="button" id="menuBtn" aria-label="목차 열기">목차</button><b id="mTitle"></b></div>
    <main class="page" id="page"></main>
  </div>
</div>

<script>

/* ───── 작은 도우미 ───── */
const todo=h=>`<div class="todo"><span class="pill p-warn">작성 필요</span><span>${h}</span></div>`;
const tdi=h=>`<span class="todo inline"><span class="pill p-warn">작성 필요</span>${h?`<span>${h}</span>`:''}</span>`;
const chk=t=>`<span class="chk"><span class="pill p-info">확인 필요</span>${t||''}</span>`;
const ul=a=>`<ul class="list">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const card=(no,title,inner,right='')=>`<section class="card"${no&&no.includes('.')?` id="c-${no.replace(/\./g,'-')}"`:''}><header><h2>${no?`<span class="no">${no}</span>`:''}${title}</h2>${right}</header><div class="body">${inner}</div></section>`;

function chPage(c){
  const info=dl([['입점 브랜드',c.brand==='레세터'?'<span class="pill p-acc">레세터</span>':'<span class="pill p-mute">로브로브</span>'],
    ['판매자 센터',c.center?(c.url?`<a href="${c.url}" target="_blank" rel="noopener">${c.center} ↗</a>`:c.center)+(c.cnote?`<br><span style="color:var(--ink3);font-size:12.5px">${c.cnote}</span>`:''):tdi('판매자 센터 이름·링크')],['정산 주기',c.cycle||tdi()]]);
  let h=card('','채널 개요',info);
  h+=card('','단독 상품',c.excl&&c.excl.length?ul(c.excl):todo(SEC0[2]));
  let n=0;const sk=c.skip||[];
  SEC.forEach(([k,t,hint])=>{
    if(k==='note'&&c.extra)c.extra.forEach(([t2,h2,html])=>{h+=card(`${++n}`,t2,html||todo(h2));});
    if(sk.includes(k))return;
    const a=c[k];h+=card(`${++n}`,t,(a&&a.length?ul(a):todo(hint))+(k==='reg'?'<p class="lede">제조국 등 표시 정보 확인과 오픈 전 더블체크는 4.5 상품 등록 기준 참고.</p>':''));});
  return h;}

function tocPage(){
  let h='';
  let pt='';
  for(const g of G){if(g.label==='시작')continue;
    if(g.part&&g.part!==pt){pt=g.part;h+=`<div class="tocpart">${pt}</div>`;}
    h+=`<div class="tocg"><h3>${g.no&&g.no!=='부록'?`<span class="no">${g.no}</span>`:''}${g.label}</h3>`;
    for(const p of g.items){const n=TODO[p.id];
      h+=`<button type="button" class="tocrow" data-go="${p.id}"><span class="no">${p.no}</span><span class="nm">${p.title}</span>${n?`<span class="pill p-warn">작성 ${n}</span>`:''}<span class="lead"></span><span class="pg">p.${byId(p.id).pg}</span></button>`;}
    h+='</div>';}
  const total=Object.values(TODO).reduce((a,b)=>a+b,0);
  return card('','목차',`<p class="lede">항목을 누르면 해당 페이지로 이동. 노란 표시는 작성이 필요한 칸 수 (현재 ${total}칸).</p>`)+
    `<section class="card" style="padding:4px 0 10px">${h}</section>`;}

const $=s=>document.querySelector(s);
let cur='cover';
function renderNav(){
  let h='';
  let pt='';
  for(const g of G){if(g.part&&g.part!==pt){pt=g.part;h+=`<div class="part">${pt}</div>`;}h+=`<div class="grp"><h3>${g.label}</h3>`;
    for(const p of g.items)h+=`<button type="button" class="nav" data-go="${p.id}" ${p.id===cur?'aria-current="page"':''}><span class="no">${p.no}</span><span class="nm">${p.title}</span>${TODO[p.id]?'<span class="dot" title="작성 필요 항목 있음"></span>':''}</button>`;
    h+='</div>';}
  $('#nav').innerHTML=h;}
function go(id){if(!byId(id))id='cover';cur=id;try{localStorage.setItem('lovmd',id);}catch(e){}
  try{history.replaceState(null,'','#'+id);}catch(e){}
  $('#app').classList.remove('open');render();window.scrollTo(0,0);}
function render(){
  renderNav();
  const p=byId(cur),i=PAGES.indexOf(p),prev=PAGES[i-1],next=PAGES[i+1];
  $('#mTitle').textContent=(p.no?p.no+' ':'')+p.title;
  let h='';
  if(p.id!=='cover'){
    h+=`<div class="crumb">${p.grp.part?`<span>${p.grp.part}</span><i>›</i>`:''}<span>${p.grp.label}</span>${p.grp.label!=='시작'?`<i>›</i><span>${p.title}</span>`:''}</div>
    <div class="dh"><h1>${p.no?`<span class="no">${p.no}</span>`:''}${p.title}</h1>${p.desc?`<p>${p.desc}</p>`:''}
    <div class="meta"><span><b>${DOC.no}</b></span><span>${DOC.ver}</span><span>개정 ${DOC.date}</span>${TODO[p.id]?`<span class="pill p-warn">작성 필요 ${TODO[p.id]}</span>`:''}</div></div>`;}
  h+=p.render();
  h+=`<nav class="pager" aria-label="페이지 이동">${prev?`<button type="button" data-go="${prev.id}"><small>← 이전</small><b>${prev.no?prev.no+' ':''}${prev.title}</b></button>`:'<span></span>'}${next?`<button type="button" class="nx" data-go="${next.id}"><small>다음 →</small><b>${next.no?next.no+' ':''}${next.title}</b></button>`:'<span></span>'}</nav>
  <div class="pfoot"><span>필로우북 매뉴얼 · ${DOC.no}</span><span>p. ${p.pg} / ${PAGES.length}</span></div>`;
  $('#page').innerHTML=h;}
document.addEventListener('click',e=>{const cp=e.target.closest('[data-copy]');if(cp){const pre=document.getElementById(cp.dataset.copy);const t=pre?pre.innerText:'';const done=()=>{cp.textContent='복사됨';setTimeout(()=>cp.textContent='복사',1500);};const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const g=getSelection();g.removeAllRanges();g.addRange(r);cp.textContent='선택됨 · Ctrl+C';};try{navigator.clipboard.writeText(t).then(done,sel);}catch(x){sel();}return;}const j=e.target.closest('[data-jump]');if(j){const x=document.getElementById(j.dataset.jump);if(x)x.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}const t=e.target.closest('[data-go]');if(t){go(t.dataset.go);const an=t.dataset.anchor;if(an){const x=document.getElementById(an);if(x)x.scrollIntoView({block:'start'});}}});
document.addEventListener('input',e=>{if(e.target.id!=='glq')return;const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.glcard').forEach(c=>{let n=0;c.querySelectorAll('tr[data-t]').forEach(r=>{const on=!q||r.dataset.t.includes(q);r.hidden=!on;if(on)n++;});c.hidden=n===0;});
  const em=document.getElementById('glempty');if(em)em.hidden=!!document.querySelector('.glcard:not([hidden])');});
$('#logo').onclick=()=>go('cover');
try{if(window.self!==window.top){document.getElementById('logo').style.display='none';}}catch(e){}
$('#menuBtn').onclick=()=>$('#app').classList.toggle('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#app').classList.remove('open');});
$('#sideVer').textContent=`${DOC.no} · ${DOC.ver}`;
(()=>{const h=location.hash.replace('#','');let id=byId(h)?h:null;if(!id){try{const s=localStorage.getItem('lovmd');if(byId(s))id=s;}catch(e){}}cur=id||'cover';render();})();
</script>
