<title>레세터 판매 대시보드 · 2026.10</title>
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--line:#E7E9ED;--line-2:#DCDFE4;--text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529;--accent-soft:#FDEEE9;--blue:#2563EB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:23px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;max-width:860px}
.brandsw{display:flex;gap:7px;flex-shrink:0}
.brandsw a{text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);background:var(--card)}
.brandsw a.on{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.mtabs{display:inline-flex;gap:4px;margin:20px 0 6px;background:var(--card);padding:4px;border:1px solid var(--line);border-radius:12px}
.mtab{cursor:pointer;font-size:14px;font-weight:600;padding:8px 20px;border:none;border-radius:8px;background:none;color:var(--text-2)}
.mtab.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:7px;margin:14px 0 2px;flex-wrap:wrap}
.tab{cursor:pointer;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--text-2)}
.tab.on{background:var(--text-1);color:#fff;border-color:var(--text-1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpi .lab{color:var(--text-2);font-size:12px;margin-bottom:8px}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.01em}
.kpi .sub2{color:var(--text-3);font-size:11px;margin-top:6px;min-height:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700}
.cs{color:var(--text-3);font-size:11.5px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--text-3);font-weight:600;font-size:11px;text-align:right}
td{color:var(--text-1);font-weight:600}
th.n,td.n{text-align:left}
tr.r1 td{background:var(--accent-soft)}
tr.clk{cursor:pointer}tr.clk:hover td{background:#F4F5F7}
.rank{display:inline-block;min-width:20px;color:var(--text-3);font-weight:600;margin-right:6px}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.daychip{cursor:pointer;font-size:12px;padding:6px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--text-2)}
.daychip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.hb{transition:opacity .1s}.hb:hover{opacity:.82}
.colorpop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:16px 16px 14px;min-width:255px;max-width:340px;max-height:82vh;overflow:auto;box-shadow:0 10px 30px rgba(16,24,40,.14);font-size:13px;color:var(--text-1)}
.colorpop h4{margin:0 22px 2px 0;font-size:14px;font-weight:700}.colorpop .cpsub{font-size:11px;color:var(--text-3);margin-bottom:11px}
.colorpop .seclab{font-size:10.5px;letter-spacing:.02em;color:var(--text-3);margin:13px 0 7px}
.colorpop .crow{margin:7px 0}.colorpop .cline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.colorpop .cq{color:var(--text-2);padding-left:10px;white-space:nowrap}
.colorpop .cbarwrap{height:6px;background:#EEF0F3;border-radius:3px;overflow:hidden}.colorpop .cbar{height:100%;background:var(--blue)}
.colorpop .sbar{background:var(--accent)}.colorpop .jbar{background:#16A34A}
.colorpop .cpclose{position:absolute;top:9px;right:11px;cursor:pointer;color:var(--text-3)}
.foot{color:var(--text-3);font-size:11px;text-align:center;margin-top:26px}

function won(n){return '₩'+Math.round(n).toLocaleString('en-US');}
function dlab(d){var wd=['일','월','화','수','목','금','토'];var dt=new Date(d);return (dt.getMonth()+1)+'/'+dt.getDate()+'('+wd[dt.getDay()]+')';}
function scopeLabel(){return cur==='전체통합'?'전채널':cur;}
function dailyChart(src){
  var days=D.days;var max=Math.max.apply(null,days.map(function(d){return (src.dayTotals[d]||{amt:0}).amt;}))||1;
  var W=1080,H=240,PL=54,PR=12,PT=12,PB=28,n=days.length;
  var bw=Math.min(60,(W-PL-PR)/n*0.6);var gap=(W-PL-PR)/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(var g=0;g<=4;g++){var yy=PT+(H-PT-PB)*g/4;var val=max*(1-g/4);s+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#EDEFF2"/><text x="'+(PL-8)+'" y="'+(yy+4)+'" fill="#9AA3AD" font-size="10" text-anchor="end">'+Math.round(val/1000)+'K</text>';}
  days.forEach(function(d,i){var v=(src.dayTotals[d]||{amt:0}).amt;var hh=(H-PT-PB)*(v/max);var x=PL+gap*i+gap/2-bw/2;var y=H-PB-hh;
    s+='<rect class="hb" data-t="'+dlab(d)+'" data-v="'+won(v)+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(hh,1)+'" rx="4" fill="'+(d==curDay?'#EA5529':'#2563EB')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-PB+14)+'" fill="#9AA3AD" font-size="10" text-anchor="middle">'+dlab(d)+'</text>';
    if(v>0)s+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" fill="#5B6470" font-size="10" text-anchor="middle">'+Math.round(v/1000)+'K</text>';});
  return s+'</svg>';
}
function topBars(top){
  var max=Math.max.apply(null,top.map(function(t){return t.amt;}))||1;var rows=top.slice(0,20);
  var W=1080,rh=30,H=rows.length*rh+8,PL=4,barX=180,PR=78;var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  rows.forEach(function(t,i){var yy=i*rh+6;var w=(W-barX-PR)*(t.amt/max);var nm=t.name;
    s+='<text x="'+PL+'" y="'+(yy+15)+'" fill="var(--text-1)" font-size="11.5" font-weight="600">'+(i+1)+'. '+(nm.length>15?nm.slice(0,15)+'…':nm)+'</text>';
    s+='<rect class="hb" data-t="'+nm+'" data-v="'+won(t.amt)+' · '+t.qty+'장" x="'+barX+'" y="'+(yy+3)+'" width="'+Math.max(w,2)+'" height="16" rx="4" fill="'+(i==0?'#EA5529':'#2563EB')+'"/>';
    s+='<text x="'+(barX+w+8)+'" y="'+(yy+15)+'" fill="#5B6470" font-size="11">'+won(t.amt)+'</text>';});
  return s+'</svg>';
}
function topTable(top,tot){
  var h='<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>';
  top.slice(0,20).forEach(function(t,i){h+='<tr class="'+(i==0?'r1':'')+'" data-prod="'+String(t.name).replace(/"/g,'&quot;')+'"><td class="n"><span class="rank">'+(i+1)+'</span>'+t.name+'</td><td>'+t.qty+'</td><td>'+won(t.amt)+'</td><td>'+(t.amt/tot*100).toFixed(1)+'%</td></tr>';});
  return h+'</table>';
}
function dayTopTable(){
  var dt=(curSrc().dayTop||{})[curDay]||[];
  if(!dt.length)return '<div class="cs">이 날 판매 없음</div>';
  var tot=dt.reduce(function(s,t){return s+t.amt;},0)||1;
  var h='<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>';
  dt.forEach(function(t,i){h+='<tr class="'+(i==0?'r1':'')+'" data-prod="'+String(t.name).replace(/"/g,'&quot;')+'"><td class="n"><span class="rank">'+(i+1)+'</span>'+t.name+'</td><td>'+t.qty+'</td><td>'+won(t.amt)+'</td><td>'+(t.amt/tot*100).toFixed(1)+'%</td></tr>';});
  return h+'</table>';
}
function render(){
  document.querySelectorAll('.mtab').forEach(function(b,i){b.classList.toggle('on',MONTHS[i][0]==curMonth);});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==cur);});
  var src=curSrc();var nd=D.days.length;
  var kpis=[['총 실결제금액',won(src.periodAmt),'기간 '+nd+'일 합계'],['총 판매량',src.periodQty.toLocaleString()+'장',''],['주문 건수',src.periodOrders.toLocaleString()+'건',''],['일평균 매출',won(Math.round(src.periodAmt/nd)),'']];
  if(src.cancelAmt)kpis.push(['취소·환불','-'+won(src.cancelAmt),src.cancelCnt+'건 · 실결제 제외분']);
  document.getElementById('kpis').innerHTML=kpis.map(function(k){return '<div class="kpi"><div class="lab">'+k[0]+'</div><div class="val">'+k[1]+'</div><div class="sub2">'+k[2]+'</div></div>';}).join('');
  var h='';
  h+='<div class="card"><h3>일별 매출 추이</h3><div class="cs">'+scopeLabel()+' 일별 실결제금액</div>'+dailyChart(src)+'</div>';
  h+='<div class="grid"><div class="card"><h3>TOP 상품</h3><div class="cs">'+scopeLabel()+' · 실결제금액</div>'+topBars(src.top)+'</div>';
  h+='<div class="card"><h3>TOP 상품 표</h3><div class="cs">수량 · 실결제 · 비중</div>'+topTable(src.top,src.periodAmt)+'</div></div>';
  h+='<div class="card"><h3>일별 TOP 상품</h3><div class="cs">날짜 선택</div><div class="daychips" id="daychips">'+D.days.map(function(d){return '<button class="daychip'+(d==curDay?' on':'')+'" data-day="'+d+'">'+dlab(d)+'</button>';}).join('')+'</div><div id="dayTopTable">'+dayTopTable()+'</div></div>';
  document.getElementById('views').innerHTML=h;
  bindTips();mark();
}
function bindTips(){
  document.querySelectorAll('.hb').forEach(function(el){
    el.addEventListener('mousemove',function(e){showTip(e,'<b>'+el.dataset.t+'</b><br>'+el.dataset.v);});
    el.addEventListener('mouseleave',hideTip);});
  document.querySelectorAll('.daychip').forEach(function(b){b.addEventListener('click',function(){curDay=b.dataset.day;document.querySelectorAll('.daychip').forEach(function(x){x.classList.toggle('on',x.dataset.day==curDay);});document.getElementById('dayTopTable').innerHTML=dayTopTable();mark();});});
}
var tip;function showTip(e,html){if(!tip){tip=document.createElement('div');tip.style.cssText='position:fixed;z-index:70;background:#1A1D21;border:none;border-radius:8px;padding:7px 10px;font-size:12px;color:#fff;pointer-events:none';document.body.appendChild(tip);}tip.innerHTML=html;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-160)+'px';tip.style.top=(e.clientY+12)+'px';}
function hideTip(){if(tip)tip.style.display='none';}
var BP=COL.byPlat,pop;
function ensurePop(){if(!pop){pop=document.createElement('div');pop.className='colorpop';pop.hidden=true;document.body.appendChild(pop);}}
function platList(){return cur==='전체통합'?PLATS:[cur];}
var ALLPROD={};(function(){PLATS.forEach(function(p){var c=BP[p]&&BP[p].colors;if(c)Object.keys(c).forEach(function(k){ALLPROD[k]=1;});});})();
function md(d){var p=d.split('-');return (p[1]*1)+'/'+(p[2]*1);}
function getMap(prod,pk,dk,daily){
  var out={},any=false,mdays=D.days,d=curDay;
  function acc(s){if(s)Object.keys(s).forEach(function(k){if(!out[k])out[k]=[0,0];out[k][0]+=s[k][0];out[k][1]+=s[k][1];any=true;});}
  platList().forEach(function(p){var dm=BP[p]&&BP[p][dk];if(!dm)return;if(daily){acc(dm[d]&&dm[d][prod]);}else{mdays.forEach(function(dd){acc(dm[dd]&&dm[dd][prod]);});}});
  return any?out:null;
}
function bars(obj,cls){var ents=Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1][0]-a[1][0];});var tot=ents.reduce(function(s,e){return s+e[1][0];},0)||1;var h='';ents.forEach(function(e){var pct=Math.round(e[1][0]/tot*100);h+='<div class="crow"><div class="cline"><span>'+e[0]+'</span><span class="cq">'+e[1][0]+'장 · '+pct+'%</span></div><div class="cbarwrap"><div class="cbar '+cls+'" style="width:'+pct+'%"></div></div></div>';});return h;}
function sectionDaily(tr){var el=tr;while(el&&el!==document.body){if(el.querySelector){var hh=el.querySelector('h3');if(hh)return /일별/.test(hh.textContent);}el=el.parentElement;}return false;}
function showColor(name,daily,x,y){ensurePop();var cd=getMap(name,'colors','dayColors',daily);var sd=getMap(name,'sizes','daySizes',daily);var jd=getMap(name,'combos','dayCombos',daily);
  var mr=D.days;var mrange=mr.length?(md(mr[0])+'~'+md(mr[mr.length-1])):'';
  var label=scopeLabel()+' · '+(daily?('일별 · '+md(curDay)):((curMonth.slice(5)*1)+'월 · '+mrange));var h='<span class="cpclose">✕</span><h4>'+name+'</h4>';
  if(!cd){pop.innerHTML=h+'<div class="cpsub">'+label+'</div><div class="cs">데이터 없음</div>';}
  else{var tot=Object.keys(cd).reduce(function(s,k){return s+cd[k][0];},0)||1;h+='<div class="cpsub">'+label+' · 총 '+tot+'장</div><div class="seclab">컬러별</div>'+bars(cd,'');
    if(jd){var jo={},any=false;Object.keys(jd).forEach(function(k){var p=k.split('|');if(p[1]!=='FREE'&&p[1]!=='(미분류)'){jo[p[0]+' · '+p[1]]=jd[k];any=true;}});if(any)h+='<div class="seclab">컬러 × 사이즈</div>'+bars(jo,'jbar');}
    if(sd){var real={},has=false;Object.keys(sd).forEach(function(k){if(k!=='(미분류)'){real[k]=sd[k];if(k!=='FREE')has=true;}});if(has)h+='<div class="seclab">사이즈별</div>'+bars(real,'sbar');}
    pop.innerHTML=h;}
  pop.hidden=false;var pw=pop.offsetWidth,ph=pop.offsetHeight;pop.style.left=Math.max(8,Math.min(x+12,innerWidth-pw-12))+'px';pop.style.top=Math.max(8,Math.min(y+12,innerHeight-ph-12))+'px';
  pop.querySelector('.cpclose').onclick=function(ev){ev.stopPropagation();pop.hidden=true;};}
function prodOf(tr){if(tr.dataset&&tr.dataset.prod)return tr.dataset.prod;var td=tr.querySelector('td');return td?td.textContent.replace(/^\d+\s*/,'').trim():'';}
function mark(){document.querySelectorAll('#views table tr').forEach(function(tr){if(ALLPROD[prodOf(tr)])tr.classList.add('clk');});}
document.addEventListener('click',function(e){ensurePop();if(pop.contains(e.target))return;var tr=e.target.closest('tr');if(tr){var nm=prodOf(tr);if(ALLPROD[nm]){showColor(nm,sectionDaily(tr),e.clientX,e.clientY);return;}}pop.hidden=true;});
document.getElementById('months').innerHTML=MONTHS.map(function(m){return '<div class="mtab'+(m[0]==curMonth?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</div>';}).join('');
document.querySelectorAll('.mtab').forEach(function(b){b.addEventListener('click',function(){curMonth=b.dataset.m;D=DM[curMonth];curDay=D.days[D.days.length-1];render();});});
document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<div class="tab'+(t==cur?' on':'')+'" data-t="'+t+'">'+t+'</div>';}).join('');
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){cur=b.dataset.t;render();});});
(function(){var dd=D.days;document.getElementById('daterange').textContent='2026.'+dd[0].slice(5).replace('-','.')+' – '+dd[dd.length-1].slice(5).replace('-','.')+' · '+PLATS.join('·')+' · 실결제금액 기준 · 취소·환불 제외 · 상품 클릭 → 컬러/사이즈별';})();
render();
</script></body></html>
