const MONTHS=Object.keys(DM).sort().map(function(k){return [k,(k.slice(5)*1)+'월'];});
let curMonth=MONTHS[MONTHS.length-1][0];
let D=DM[curMonth];
let curDay=D.days[D.days.length-1];
const PLATS=D.platforms;
const TABS=['전체통합'].concat(PLATS);
let cur='전체통합';
const PCH={'무신사':'#2563EB'};
function curSrc(){return cur==='전체통합'?D.combined:D.byPlat[cur];}
function won(n){return '₩'+Math.round(n).toLocaleString('en-US');}
function dlab(d){var wd=['일','월','화','수','목','금','토'];var dt=new Date(d);return (dt.getMonth()+1)+'/'+dt.getDate()+'('+wd[dt.getDay()]+')';}
function scopeLabel(){return cur==='전체통합'?'전채널':cur;}
function dailyChart(src){
  var days=D.days;var max=Math.max.apply(null,days.map(function(d){return (src.dayTotals[d]||{amt:0}).amt;}))||1;
  var W=1080,H=240,PL=54,PR=12,PT=12,PB=28,n=days.length;
  var bw=Math.min(60,(W-PL-PR)/n*0.6);var gap=(W-PL-PR)/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(var g=0;g<=4;g++){var yy=PT+(H-PT-PB)*g/4;var val=max*(1-g/4);s+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#EDEFF2"/><text x="'+(PL-8)+'" y="'+(yy+4)+'" fill="#9AA3AD" font-size="10" text-anchor="end">'+Math.round(val/1000)+'K</text>';}
  days.forEach(function(d,i){var v=(src.dayTotals[d]||{amt:0}).amt;var hh=(H-PT-PB)*(v/max);var x=PL+gap*i+gap/2-bw/2;var y=H-PB-hh;
    s+='<rect class="hb" data-t="'+dlab(d)+'" data-v="'+won(v)+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(hh,1)+'" rx="4" fill="'+(d==curDay?'#EA5529':'#2563EB')+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-PB+14)+'" fill="#9AA3AD" font-size="10" text-anchor="middle">'+dlab(d)+'</text>';
    if(v>0)s+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" fill="#5B6470" font-size="10" text-anchor="middle">'+Math.round(v/1000)+'K</text>';});
  return s+'</svg>';
}
function topBars(top){
  var max=Math.max.apply(null,top.map(function(t){return t.amt;}))||1;var rows=top.slice(0,20);
  var W=1080,rh=30,H=rows.length*rh+8,PL=4,barX=180,PR=78;var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  rows.forEach(function(t,i){var yy=i*rh+6;var w=(W-barX-PR)*(t.amt/max);var nm=t.name;
    s+='<text x="'+PL+'" y="'+(yy+15)+'" fill="var(--text-1)" font-size="11.5" font-weight="600">'+(i+1)+'. '+(nm.length>15?nm.slice(0,15)+'…':nm)+'</text>';
    s+='<rect class="hb" data-t="'+nm+'" data-v="'+won(t.amt)+' · '+t.qty+'장" x="'+barX+'" y="'+(yy+3)+'" width="'+Math.max(w,2)+'" height="16" rx="4" fill="'+(i==0?'#EA5529':'#2563EB')+'"/>';
    s+='<text x="'+(barX+w+8)+'" y="'+(yy+15)+'" fill="#5B6470" font-size="11">'+won(t.amt)+'</text>';});
  return s+'</svg>';
}
function topTable(top,tot){
  var h='<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>';
  top.slice(0,20).forEach(function(t,i){h+='<tr class="'+(i==0?'r1':'')+'" data-prod="'+String(t.name).replace(/"/g,'&quot;')+'"><td class="n"><span class="rank">'+(i+1)+'</span>'+t.name+'</td><td>'+t.qty+'</td><td>'+won(t.amt)+'</td><td>'+(t.amt/tot*100).toFixed(1)+'%</td></tr>';});
  return h+'</table>';
}
function dayTopTable(){
  var dt=(curSrc().dayTop||{})[curDay]||[];
  if(!dt.length)return '<div class="cs">이 날 판매 없음</div>';
  var tot=dt.reduce(function(s,t){return s+t.amt;},0)||1;
  var h='<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>';
  dt.forEach(function(t,i){h+='<tr class="'+(i==0?'r1':'')+'" data-prod="'+String(t.name).replace(/"/g,'&quot;')+'"><td class="n"><span class="rank">'+(i+1)+'</span>'+t.name+'</td><td>'+t.qty+'</td><td>'+won(t.amt)+'</td><td>'+(t.amt/tot*100).toFixed(1)+'%</td></tr>';});
  return h+'</table>';
}
function render(){
  document.querySelectorAll('.mtab').forEach(function(b,i){b.classList.toggle('on',MONTHS[i][0]==curMonth);});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==cur);});
  var src=curSrc();var nd=D.days.length;
  var kpis=[['총 실결제금액 (Revenue)',won(src.periodAmt),'기간 '+nd+'일 합계'],['총 판매량 (Units)',src.periodQty.toLocaleString()+'장',''],['주문 건수 (Orders)',src.periodOrders.toLocaleString()+'건',''],['객단가 (AOV)',won(Math.round(src.periodAmt/Math.max(src.periodOrders,1))),'주문당 평균'],['일평균 매출 (Daily Avg)',won(Math.round(src.periodAmt/nd)),'']];
  if(src.cancelAmt)kpis.push(['취소·환불 (Refunds)','-'+won(src.cancelAmt),src.cancelCnt+'건 · 실결제 제외분']);
  document.getElementById('kpis').innerHTML=kpis.map(function(k){return '<div class="kpi"><div class="lab">'+k[0]+'</div><div class="val">'+k[1]+'</div><div class="sub2">'+k[2]+'</div></div>';}).join('');

  document.getElementById('views').innerHTML=h;
  bindTips();mark();
}

<script>
(function(){

function open(n){ST.name=n;ST.plat='전체';q.value=n;sug.innerHTML='';draw()}
function wkey(d){var t=new Date(d+'T00:00:00Z');var w=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-w);return t.toISOString().slice(0,10)}
function md(d){return (+d.slice(5,7))+'/'+(+d.slice(8))}

    B.slice().reverse().filter(function(b){return b.q||ST.unit!=='day'}).map(function(b){return '<tr><td class="n">'+b.lab+(b.part?' <span class="hint">(진행 중)</span>':'')+'</td><td>'+W_(b.a)+'</td><td>'+b.q.toLocaleString()+'</td>'+(cols.length>1?cols.map(function(p){var c=b.v[p];return '<td>'+(c?(ST.metric==='amt'?Math.round(c[1]/1e3).toLocaleString()+'K':c[0]+'장'):'<span class="hint">–</span>')+'</td>'}).join(''):'')+'</tr>'}).join('')+'</table></div>';

}
function chart(B){
  var el=document.getElementById('ps-chart');var met=ST.metric;var val=function(c){return met==='amt'?c[1]:c[0]};
  var n=B.length;var Wd=Math.max(el.clientWidth||900,n*(ST.unit==='day'?9:28)),H=240,PL=56,PR=12,PT=16,PB=32;
  var tot=B.map(function(b){return met==='amt'?b.a:b.q});var mx=Math.max.apply(null,tot.concat([1]))*1.12;
  var bw=(Wd-PL-PR)/Math.max(n,1),bwid=Math.max(2,Math.min(40,bw*0.68));var y=function(v){return PT+(H-PT-PB)*(1-v/mx)};
  var fmt=function(v){return met==='amt'?(v>=1e6?(v/1e6).toFixed(v>=1e7?0:1)+'M':Math.round(v/1e3)+'K'):Math.round(v).toLocaleString()};
  var s='<svg viewBox="0 0 '+Wd+' '+H+'" width="'+(Wd>(el.clientWidth||900)?Wd:'100%')+'" height="'+H+'">';
  for(var g=0;g<=4;g++){var gv=mx*g/4,yy=y(gv);s+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(Wd-PR)+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(PL-8)+'" y="'+(yy+4)+'" fill="var(--text-3)" font-size="10" text-anchor="end">'+fmt(gv)+'</text>'}
  var step=Math.max(1,Math.ceil(n/(ST.unit==='day'?16:12)));
  B.forEach(function(b,i){var cx=PL+bw*i+bw/2,yb=H-PB;var order=PLATS.filter(function(p){return b.v[p]});
    var tipT=b.lab+(b.part?' (진행 중)':'');var tipV=(met==='amt'?W_(b.a):b.q+'장')+(order.length>1?'<br>'+order.map(function(p){return esc(p)+' '+(met==='amt'?W_(b.v[p][1]):b.v[p][0]+'장')}).join('<br>'):'');
    order.forEach(function(p){var v=val(b.v[p]);if(v<=0)return;var hh=(H-PT-PB)*(v/mx);s+='<rect x="'+(cx-bwid/2)+'" y="'+(yb-hh)+'" width="'+bwid+'" height="'+Math.max(hh-(order.length>1?1:0),0.5)+'" rx="2" fill="'+(PCOL[p]||'#999')+'"'+(b.part?' opacity=".55"':'')+'/>';yb-=hh});
    s+='<rect class="hb" data-t="'+esc(tipT)+'" data-v="'+esc(tipV)+'" x="'+(cx-bw/2)+'" y="'+PT+'" width="'+bw+'" height="'+(H-PT-PB)+'" fill="transparent"/>';
    if(ST.unit!=='day'&&tot[i]>0)s+='<text x="'+cx+'" y="'+(y(tot[i])-5)+'" fill="var(--text-2)" font-size="10.5" font-weight="700" text-anchor="middle">'+fmt(tot[i])+'</text>';
    if(i%step===0||i===n-1)s+='<text x="'+cx+'" y="'+(H-PB+16)+'" fill="var(--text-3)" font-size="10.5" text-anchor="middle">'+(ST.unit==='week'?md(b.k):b.lab)+'</text>'});
  s+='</svg>';el.innerHTML=s;
  el.querySelectorAll('.hb').forEach(function(r){r.style.cursor='pointer';r.addEventListener('mousemove',function(e){if(typeof showTip==='function')showTip(e,'<b>'+r.dataset.t+'</b><br>'+r.dataset.v)});r.addEventListener('mouseleave',function(){if(typeof hideTip==='function')hideTip()})});
}
window.addEventListener('resize',function(){if(ST.name)draw()});
})();
</script>

<style>
.stk-bar{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);padding:10px 12px}
.stk-bar .top{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.stk-bar .top b{font-weight:700}
.stk-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.stk-l3{background:#FDE8E8;color:#B42318}.stk-l2{background:#FFF1E0;color:#B54708}.stk-l1{background:#FEF7D6;color:#8A6100}.stk-ok{background:#E6F4EC;color:#1F7A4D}.stk-na{background:var(--bg);color:var(--text-3)}
.stk-tog{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--text-2);cursor:pointer;margin-left:auto}
.stk-list{margin-top:10px;max-height:320px;overflow:auto}
.stk-list table td,.stk-list table th,.stk-tbl td,.stk-tbl th{padding:6px 7px;font-size:12px}
.stk-list tr[data-n]{cursor:pointer}.stk-list tr[data-n]:hover td{background:var(--bg)}
.stk-box{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.stk-box h4{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stk-box h4 .hint{font-weight:500}
.stk-kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:10px 0}
.stk-kp .k{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stk-kp .l{font-size:11.5px;color:var(--text-2)}.stk-kp .v{font-size:18px;font-weight:700;margin-top:4px;white-space:nowrap}.stk-kp .s{font-size:11px;color:var(--text-3);margin-top:2px}
.stk-tw{overflow:auto;max-width:100%}
.stk-neg{color:#B42318}
@media(max-width:820px){.stk-kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
(function(){
var host=document.getElementById('psearch');if(!host)return;
var BRAND=/lessetter/.test(location.pathname)?'레세터':'로브로브';
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var norm=function(s){return String(s).toLowerCase().replace(/\s+/g,'')};
var LV={3:['stk-l3','미송 발생'],2:['stk-l2','2주 내 소진'],1:['stk-l1','한 달 내 소진']};
var S=null,KEY={};
function md(t){var d=t.slice(0,10);return (+d.slice(5,7))+'/'+(+d.slice(8))+(t.length>10?' '+t.slice(11):'')}
function f1(x){return x>=10?Math.round(x).toLocaleString():x.toFixed(1)}
function cov(p,x){var r=(p.v7||p.v28)*x.sh;return [r,r>0?x.av/r:null]}
function badge(x,r,cv){
  if(x.av<0&&(x.sj>0||r>=0.3)&&r>0)return '<span class="stk-pill stk-l3">미송 '+(-x.av)+'</span>';
  if(x.av<=0&&r<=0)return '<span class="stk-pill stk-na">품절·판매없음</span>';
  if(x.av<=0)return '<span class="stk-pill stk-l3">품절</span>';
  if(cv==null)return '<span class="stk-pill stk-na">최근 판매 없음</span>';
  if(cv<=14&&r>=0.3)return '<span class="stk-pill stk-l2">'+Math.max(0,Math.floor(cv))+'일분</span>';
  if(cv<=30&&r>=0.3)return '<span class="stk-pill stk-l1">'+Math.floor(cv)+'일분</span>';
  return '<span class="stk-pill stk-ok">'+(cv>365?'1년+':Math.floor(cv)+'일분')+'</span>'}
function openProduct(n){var q=document.getElementById('ps-q');if(!q)return;q.value=n;q.dispatchEvent(new Event('input',{bubbles:true}));setTimeout(function(){var b=document.querySelector('#ps-sug button[data-n]');if(b&&b.dataset.n===n)b.click();host.scrollIntoView({behavior:'smooth',block:'start'})},260)}
function inbTxt(a){if(a.stale&&!a.inq)return '<span class="hint">예정일 지남·확인 필요</span>';if(!a.inq)return '<span class="stk-neg">없음</span>';var g='';if(!a.ok&&a.eta&&a.cv!=null&&a.lv<3){var od=new Date(S.asof.slice(0,10)+'T00:00:00Z');od.setUTCDate(od.getUTCDate()+Math.floor(a.cv));var gap=Math.round((new Date(a.eta+'T00:00:00Z')-od)/864e5);if(gap>0)g=' · 입고 전 '+gap+'일 품절'}if(!a.ok&&a.lv===3&&a.after!=null&&a.after<=30)g=' · 입고 후 '+Math.floor(a.after)+'일분뿐';return md(a.eta)+' '+a.inq.toLocaleString()+'장'+g}
function bar(){
  var A=S.alerts.filter(function(a){return a.b===BRAND});var E=(S.errs||[]).filter(function(a){return a.b===BRAND});var c={1:0,2:0,3:0},ok=0;A.forEach(function(a){if(a.ok)ok++;else c[a.lv]++});
  var el=document.createElement('div');el.className='stk-bar';el.id='stk-bar';
  var open=false;try{open=localStorage.getItem('stkOpen')==='1'}catch(e){}
  el.innerHTML='<div class="top"><b>재고 알림</b><span class="hint">이지어드민 '+md(S.asof)+' 기준 · 판매속도는 '+md(S.salesTo)+'까지 최근 7일</span>'+[3,2,1].map(function(l){return '<span class="stk-pill '+LV[l][0]+'">'+LV[l][1]+' '+c[l]+'</span>'}).join('')+(ok?'<span class="stk-pill stk-ok">입고로 커버 '+ok+'</span>':'')+(E.length?'<span class="stk-pill stk-na" title="정상재고가 마이너스 — 입고 등록 누락·재고 조정 확인">재고 기록 확인 '+E.length+'</span>':'')+'<button type="button" class="stk-tog" id="stk-tog">'+(open?'접기':'목록 보기')+'</button></div>'+
    '<div class="stk-list" id="stk-list"'+(open?'':' hidden')+'><table><tr><th class="n">상품</th><th class="n">옵션</th><th>판매 가능</th><th>송장</th><th>일판매</th><th class="n">상태</th><th class="n">입고 예정</th></tr>'+
    A.map(function(a){return '<tr data-n="'+esc(a.p)+'"'+(a.ok?' style="opacity:.6"':'')+'><td class="n">'+esc(a.p)+'</td><td class="n">'+esc(a.c)+(a.s&&a.s!=='FREE'&&a.s!=='ONE SIZE'?' / '+esc(a.s):'')+'</td><td class="'+(a.av<0?'stk-neg':'')+'">'+a.av.toLocaleString()+'</td><td>'+(a.sj||'–')+'</td><td>'+f1(a.r)+'</td><td class="n"><span class="stk-pill '+(a.ok?'stk-ok':LV[a.lv][0])+'">'+(a.lv===3?'미송 '+(-a.av):Math.max(0,Math.floor(a.cv))+'일분')+'</span></td><td class="n">'+inbTxt(a)+'</td></tr>'}).join('')+
    '</table>'+(E.length?'<div class="ps-note" style="margin-top:10px"><b>재고 기록 확인 필요</b> (정상재고 마이너스 = 실물보다 많이 출고된 걸로 기록됨, 입고 등록 누락이나 재고 조정 필요): '+E.map(function(e){return esc(e.p)+' '+esc(e.c)+(e.s&&e.s!=='FREE'&&e.s!=='ONE SIZE'?'/'+esc(e.s):'')+' '+e.st+(e.sj?' (송장 '+e.sj+')':'')}).join(' · ')+'</div>':'')+'<div class="ps-note">판매 가능 = 정상재고 − 송장·접수(이미 팔렸는데 아직 못 보낸 수량). 일판매 = 전 플랫폼 최근 7일 평균 × 최근 28일 옵션 비중. 입고 예정 = 입출고 구글시트의 미입고분'+(S.inbAsof?' ('+md(S.inbAsof)+' 기준)':'')+'. 입고 후에도 30일 이상 버티면 \'입고로 커버\'로 흐리게 표시. 행을 누르면 상품 상세로 이동.</div></div>';
  var row=host.querySelector('.ps-row');row.parentNode.insertBefore(el,row.nextSibling);
  document.getElementById('stk-tog').onclick=function(){var L=document.getElementById('stk-list');L.hidden=!L.hidden;this.textContent=L.hidden?'목록 보기':'접기';try{localStorage.setItem('stkOpen',L.hidden?'0':'1')}catch(e){}};
  document.getElementById('stk-list').onclick=function(e){var tr=e.target.closest('tr[data-n]');if(tr)openProduct(tr.dataset.n)};
}
function panel(){
  var res=document.getElementById('ps-res');if(!res||res.hidden||res.querySelector('.stk-box'))return;
  var h3=res.querySelector('.ps-head h3');if(!h3)return;var n=h3.textContent;
  var p=S.P[n]||S.P[KEY[norm(n)]];
  var box=document.createElement('div');box.className='stk-box';
  if(!p){box.innerHTML='<h4>현재고 <span class="hint">이지어드민 '+md(S.asof)+' 기준</span></h4><div class="ps-note">이 상품은 재고 데이터에 없어요 (재고 0이거나 이지어드민 상품명 매칭 전).</div>';insert(res,box);return}
  var st=0,sj=0,av=0;p.o.forEach(function(x){st+=Math.max(x.st,0);sj+=x.sj;av+=x.av});
  var rate=p.v7||p.v28,days=rate>0?av/rate:null;
  var rows=p.o.slice().sort(function(a,b){return b.sh-a.sh||b.st-a.st});
  var h='<h4>현재고 <span class="hint">이지어드민 '+md(S.asof)+' 기준 · '+esc(p.en)+(p.tag?' · '+esc(p.tag):'')+'</span></h4>';
  h+='<div class="stk-kp"><div class="k"><div class="l">정상재고</div><div class="v">'+st.toLocaleString()+'장</div><div class="s">실물 재고</div></div>'+
    '<div class="k"><div class="l">송장(미송)</div><div class="v'+(sj?' stk-neg':'')+'">'+sj.toLocaleString()+'장</div><div class="s">팔렸지만 출고 대기</div></div>'+
    '<div class="k"><div class="l">판매 가능</div><div class="v'+(av<0?' stk-neg':'')+'">'+av.toLocaleString()+'장</div><div class="s">정상재고 − 송장</div></div>'+
    '<div class="k"><div class="l">일평균 판매</div><div class="v">'+f1(p.v7)+'장</div><div class="s">최근 7일 · 28일 평균 '+f1(p.v28)+'</div></div>'+
    '<div class="k"><div class="l">예상 소진</div><div class="v">'+(days==null?'–':days<=0?'소진':Math.floor(days)+'일')+'</div><div class="s">상품 전체 기준</div></div></div>';
  h+='<div class="stk-tw"><table class="stk-tbl"><tr><th class="n">컬러</th><th class="n">사이즈</th><th>정상재고</th><th>송장</th><th>판매 가능</th><th>옵션 비중</th><th>일판매(추정)</th><th class="n">상태</th><th class="n">입고 예정</th></tr>'+
    rows.map(function(x){var c=cov(p,x);return '<tr><td class="n">'+esc(x.c)+'</td><td class="n">'+esc(x.s)+'</td><td>'+x.st.toLocaleString()+'</td><td>'+(x.sj||'–')+'</td><td class="'+(x.av<0?'stk-neg':'')+'">'+x.av.toLocaleString()+'</td><td>'+(x.sh?Math.round(x.sh*100)+'%':'–')+'</td><td>'+(c[0]?f1(c[0]):'–')+'</td><td class="n">'+badge(x,c[0],c[1])+'</td><td class="n">'+((x.in||[]).map(function(i){return (i.eta?md(i.eta):esc(i.raw))+' '+i.q+'장'+(i.stale?' <span class="hint">(예정일 지남)</span>':'')}).join('<br>')||'<span class="hint">–</span>')+'</td></tr>'}).join('')+'</table></div>';
  h+='<div class="ps-note">판매 속도는 판매 대시보드(전 플랫폼, 실결제·취소 제외) 기준, 옵션 비중은 최근 28일 컬러·사이즈 판매 비중. 2PACK은 구성 컬러에 나눠 반영. 입고 예정은 입출고 구글시트의 미입고분이에요.'+(S.inbAsof?' ('+md(S.inbAsof)+' 기준)':'')+'</div>';
  box.innerHTML=h;insert(res,box)}
function insert(res,box){var note=res.querySelector('.ps-note');res.insertBefore(box,note||null)}
fetch('stock.json?cb='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){S=j;Object.keys(S.P).forEach(function(k){KEY[norm(k)]=k});bar();panel();
  var res=document.getElementById('ps-res');if(res)new MutationObserver(function(){panel()}).observe(res,{childList:true});}).catch(function(){});
})();
</script>
