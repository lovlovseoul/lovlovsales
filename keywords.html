<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검색어 랭킹</title>
<style>
:root{--surface-0:#F4F5F7;--surface-1:#FFFFFF;--surface-2:#FAFBFC;--line:#E7E9ED;--line-2:#DCDFE4;--text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529;--accent-soft:#FDEEE9;--up:#1F8A5B;--down:#D64545;--own:#F2A93B;--hit:#FFF3C4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px 26px 70px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
.view{display:inline-flex;gap:3px;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.view a{font-size:13px;font-weight:700;padding:7px 16px;border-radius:7px;color:var(--text-2);text-decoration:none}
.view a.on{background:var(--accent);color:#fff}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.6}
.sub b{color:var(--text-1)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:14px 0 0;padding:10px 12px;background:var(--surface-1);border:1px solid var(--line);border-radius:12px}
.seg{display:inline-flex;gap:3px;background:var(--surface-0);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:7px;border:none;background:none;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--text-1);color:#fff}
.bar input[type=date],.bar select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--text-1)}
.bar .nb{font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text-2);cursor:pointer}
.bar .nb:disabled{opacity:.4;cursor:default}
.bar .nb.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.di{font-size:12px;color:var(--text-3);line-height:1.5}.di b{color:var(--text-1);font-weight:600}
.ctrl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:12px 0}
.ctrl input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-1);color:var(--text-1)}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:12px;line-height:1.45}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cols{grid-template-columns:1fr}}
.cols .card{margin-bottom:0;padding:14px 14px}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ph .dot{width:8px;height:8px;border-radius:50%}
.kl{display:flex;flex-direction:column}
.kr{display:grid;grid-template-columns:1.7rem minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text-1);text-decoration:none}
.kr:last-child{border-bottom:none}
.kr .r{font-weight:700;text-align:right;color:var(--text-2)}
.kr .r.t3{color:var(--accent)}
.kr .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr .c{font-size:11px;font-weight:700;white-space:nowrap}
.kr .m{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.kr.hit{background:var(--hit)}
.kr.own{background:#FFF6E8}
.kr:hover .w{text-decoration:underline}
.up{color:var(--up)}.down{color:var(--down)}.nw{color:var(--accent)}.mu{color:var(--text-3)}
.more{margin-top:8px;font:inherit;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;width:100%}
.empty{color:var(--text-3);font-size:12px;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:11.5px;color:var(--text-3);font-weight:600}
td.k,th.k{text-align:left;white-space:normal}
td.k a{color:var(--text-1);text-decoration:none;font-weight:600}
td .n{display:inline-block;min-width:26px;padding:2px 6px;border-radius:999px;background:var(--surface-0);font-weight:700}
td .n.t3{background:var(--accent-soft);color:var(--accent)}
.tw{overflow-x:auto}
.foot{color:var(--text-3);font-size:11.5px;line-height:1.6;margin-top:6px}
@media(max-width:820px){body{padding:18px 14px 56px}}
</style></head>
<body><div class="wrap">
<nav class="view"><a href="ranking.html">상품 랭킹</a><a href="keywords.html" class="on">검색어</a></nav>
<header><h1>플랫폼별 인기 검색어</h1><div class="sub" id="take">불러오는 중…</div></header>
<div class="bar">
  <div class="seg" id="modes"><button data-m="day">일간</button><button data-m="week">주간</button><button data-m="month">월간</button></div>
  <span id="dayctl"><button class="nb" id="dprev" title="이전 기록일">◀</button> <input type="date" id="dpick" aria-label="조회 날짜"> <button class="nb" id="dnext" title="다음 기록일">▶</button> <button class="nb" id="dlatest">최신</button></span>
  <select id="psel" aria-label="기간 선택" hidden></select>
  <span class="di" id="dinfo"></span>
</div>
<div class="ctrl"><input type="search" id="q" placeholder="검색어 찾기 (예: 니트, 코트, 로브로브)" aria-label="검색어 찾기"></div>
<section class="card" id="findCard" hidden><h3 id="findH">찾은 검색어</h3><div class="cs" id="findCs"></div><div class="tw" id="find"></div></section>
<div class="cols" id="cols"></div>
<section class="card" style="margin-top:12px"><h3>여러 플랫폼에서 같이 뜨는 검색어</h3><div class="cs" id="commonCs"></div><div class="tw" id="common"></div></section>
<p class="foot" id="foot"></p>
</div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v='?v='+Date.now();
const LISTS=[['무신사|인기','무신사','인기 검색어','#1A1D21'],['무신사|급상승','무신사','급상승 검색어','#5B6470'],['29CM|인기','29CM','인기 검색어','#EA5529'],['W컨셉|인기','W컨셉','인기 검색어','#2563EB'],['지그재그|인기','지그재그','인기 검색어','#8B5CF6']];
const PLATS=['무신사','29CM','W컨셉','지그재그'];
const SURL={'무신사':'https://www.musinsa.com/search/goods?keyword=','29CM':'https://www.29cm.co.kr/store/search?keyword=','W컨셉':'https://display.wconcept.co.kr/search?keyword=','지그재그':'https://zigzag.kr/search?keyword='};
const NOTE={'무신사|인기':'여성 · 실시간 순위를 수집 시각에 저장','무신사|급상승':'여성 · 실시간 순위를 수집 시각에 저장','29CM|인기':'전체 고객 기준 · 하루 단위','W컨셉|인기':'전체 고객 기준 · 상위 10개만 공개','지그재그|인기':'매일 새벽 갱신'};
const OWN=['로브로브','lovlov','레세터','lessetter'];
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const isOwn=k=>OWN.some(o=>norm(k).includes(o));
let IDX;try{IDX=await fetch('kw_index.json'+v).then(r=>r.json())}catch(e){$('take').textContent='검색어 데이터를 불러오지 못했어요.';return}
const DATES=IDX.dates||[];const LD=DATES[DATES.length-1];
const CACHE={};const get=f=>CACHE[f]??=fetch(f+v).then(r=>r.ok?r.json():null).catch(()=>null);
const wkey=d=>{const t=new Date(d+'T00:00:00Z');const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);const y=t.getUTCFullYear();const f=new Date(Date.UTC(y,0,4));const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);return `${y}-W${String(w).padStart(2,'0')}`};
const WEEKS={};DATES.forEach(d=>(WEEKS[wkey(d)]??=[]).push(d));const wkKeys=Object.keys(WEEKS).sort();
const MONTHS={};DATES.forEach(d=>(MONTHS[d.slice(0,7)]??=[]).push(d));const moKeys=Object.keys(MONTHS).sort();
const md=s=>`${+s.slice(5,7)}/${+s.slice(8)}`;
const ST={mode:'day',date:LD,week:wkKeys[wkKeys.length-1],month:moKeys[moKeys.length-1],q:'',open:{}};
let D=null,DAYS=[];
async function load(){
  if(ST.mode==='day'){let d=ST.date;if(!DATES.includes(d)){const e=DATES.filter(x=>x<=d);d=e.length?e[e.length-1]:DATES[0]}ST.dateUsed=d;D=await get('kwday_'+d+'.json');DAYS=D?[D]:[]}
  else{const ds=ST.mode==='week'?WEEKS[ST.week]||[]:MONTHS[ST.month]||[];DAYS=(await Promise.all(ds.map(d=>get('kwday_'+d+'.json')))).filter(Boolean);D=null}
  render();
}
function agg(key){const A=new Map();DAYS.forEach((d,i)=>{(d.K[key]||[]).forEach(e=>{const a=A.get(e[0])||{k:e[0],pts:0,days:0,best:999,sum:0,ranks:{}};a.pts+=Math.max(0,101-e[1]);a.days++;a.best=Math.min(a.best,e[1]);a.sum+=e[1];a.ranks[d.date]=e[1];A.set(e[0],a)})});
  return [...A.values()].map(a=>({...a,avg:Math.round(a.sum/a.days*10)/10})).sort((x,y)=>y.pts-x.pts||x.best-y.best).map((a,i)=>({...a,rank:i+1}))}
function rowsOf(key){
  if(ST.mode!=='day')return agg(key);
  const has=D&&(D.PK||[]).includes(key);
  return (D&&D.K[key]||[]).map(e=>{let ch=null;
    if(has){ch=e[2]==null?['NEW','nw']:e[2]===e[1]?['–','mu']:e[2]>e[1]?['▲'+(e[2]-e[1]),'up']:['▼'+(e[1]-e[2]),'down']}
    else if(e.length>3&&e[3]!=null){const p=e[3];ch=p==='N'?['NEW','nw']:p>0?['▲'+p,'up']:p<0?['▼'+(-p),'down']:['–','mu']}
    return{k:e[0],rank:e[1],ch}});
}
const link=(pl,k)=>SURL[pl]+encodeURIComponent(k);
function render(){
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===ST.mode));
  $('dayctl').hidden=ST.mode!=='day';$('psel').hidden=ST.mode==='day';
  const q=norm(ST.q.trim());
  if(ST.mode==='day'){const d=ST.dateUsed||LD,i=DATES.indexOf(d);$('dpick').value=d;$('dpick').min=DATES[0];$('dpick').max=LD;$('dprev').disabled=i<=0;$('dnext').disabled=i>=DATES.length-1;$('dlatest').classList.toggle('on',d===LD);
    $('dinfo').innerHTML=(ST.date!==d?`${esc(ST.date)}은 기록이 없어 그 전 기록일 · `:'')+(D&&D.T?'업데이트 '+PLATS.filter(p=>D.T[p]).map(p=>`${p} <b>${D.T[p]}</b>`).join(' / '):'')+` · 기록 ${DATES.length}일 (${DATES[0]} ~ ${LD})`;
    $('take').innerHTML=`<b>${esc(d)}${D&&D.T&&D.T['무신사']?' '+D.T['무신사']+' 기준':''}</b> · 무신사·29CM·W컨셉·지그재그 인기 검색어 · 배지는 전날 대비 순위 변동`}
  else{const keys=ST.mode==='week'?wkKeys:moKeys;const cur=ST.mode==='week'?ST.week:ST.month;
    $('psel').innerHTML=keys.slice().reverse().map(k=>{const ds=(ST.mode==='week'?WEEKS:MONTHS)[k];const lab=ST.mode==='week'?`${md(ds[0])}~${md(ds[ds.length-1])} 주`:`${k.replace('-','년 ')}월`;return `<option value="${k}"${k===cur?' selected':''}>${lab} · 기록 ${ds.length}일</option>`}).join('');
    $('dinfo').textContent='기간 안 매일 순위를 점수로 합산 (1위 100점 … 100위 1점, 100위 밖은 0점)';
    $('take').innerHTML=`<b>${ST.mode==='week'?'주간':'월간'} · 기록 ${DAYS.length}일</b> · 기간 동안 꾸준히 상위였던 검색어 순 · 오른쪽은 평균 순위·등장 일수`}
  // 플랫폼별 칸
  $('cols').innerHTML=LISTS.map(([key,pl,title,col])=>{
    const rows=rowsOf(key);const lim=ST.open[key]?rows.length:Math.min(rows.length,30);
    const day=ST.mode==='day';const st=day&&D?((D.S||{})[pl]?`표기: ${D.S[pl]} · `:'')+(D.T&&D.T[pl]?`수집 ${D.T[pl]}`:''):'';
    const body=rows.slice(0,lim).map(r=>{const hit=q&&norm(r.k).includes(q);
      const right=day?(r.ch&&r.ch[0]!=='–'?`<span class="c ${r.ch[1]}">${r.ch[0]}</span>`:''):`<span class="m">평균 ${r.avg}위 · ${r.days}일</span>`;
      return `<a class="kr${hit?' hit':isOwn(r.k)?' own':''}" href="${esc(link(pl,r.k))}" target="_blank" rel="noopener"><span class="r${r.rank<=3?' t3':''}">${r.rank}</span><span class="w">${esc(r.k)}</span>${right}</a>`}).join('');
    return `<section class="card"><div class="ph"><span class="dot" style="background:${col}"></span><h3>${esc(pl)} ${esc(title)}</h3></div><div class="cs">${esc(NOTE[key])}${st?'<br>'+esc(st):''}</div>
      <div class="kl">${body||'<div class="empty">이 날 데이터가 없어요.</div>'}</div>${rows.length>30?`<button class="more" data-k="${esc(key)}">${ST.open[key]?'접기':`더보기 (${rows.length}개)`}</button>`:''}</section>`}).join('');
  // 공통 검색어
  const M=new Map();const main=LISTS.filter(l=>l[0]!=='무신사|급상승');
  main.forEach(([key,pl])=>{rowsOf(key).forEach(r=>{if(pl==='무신사'&&r.rank>100)return;const n=norm(r.k);const o=M.get(n)||{k:r.k,ranks:{}};if(!(pl in o.ranks))o.ranks[pl]=r.rank;M.set(n,o)})});
  const com=[...M.values()].map(o=>{const rs=Object.values(o.ranks);return{...o,n:rs.length,avg:rs.reduce((a,b)=>a+b,0)/rs.length}}).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n||a.avg-b.avg).slice(0,25);
  $('commonCs').textContent=`2개 이상 플랫폼 인기 검색어에 같이 오른 검색어 · 띄어쓰기 무시 · 무신사는 100위까지 · ${ST.mode==='day'?'숫자는 그날 순위':'숫자는 기간 점수 순위'}`;
  $('common').innerHTML=com.length?`<table><thead><tr><th class="k">검색어</th>${PLATS.map(p=>`<th>${p}</th>`).join('')}<th>플랫폼 수</th></tr></thead><tbody>${com.map(o=>`<tr><td class="k"><a href="${esc(link('무신사',o.k))}" target="_blank" rel="noopener">${esc(o.k)}</a></td>${PLATS.map(p=>`<td>${o.ranks[p]?`<span class="n${o.ranks[p]<=3?' t3':''}">${o.ranks[p]}</span>`:'<span class="mu">–</span>'}</td>`).join('')}<td>${o.n}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">겹치는 검색어가 없어요.</div>';
  find();
  $('foot').textContent='검색어를 누르면 그 플랫폼 검색 결과가 열려요. 노란 줄 = 찾은 검색어, 주황 줄 = 로브로브·레세터가 들어간 검색어. 무신사는 여성 필터 기준이고, 29CM·W컨셉·지그재그는 성별 구분 없이 플랫폼이 보여주는 순위예요.';
}
async function find(){
  const q=norm(ST.q.trim());$('findCard').hidden=!q;if(!q)return;
  // 이 달(또는 선택 기간)의 날짜별 순위
  const ds=ST.mode==='day'?(MONTHS[(ST.dateUsed||LD).slice(0,7)]||[]):(ST.mode==='week'?WEEKS[ST.week]:MONTHS[ST.month])||[];
  const days=(await Promise.all(ds.map(d=>get('kwday_'+d+'.json')))).filter(Boolean);
  const rows=[];LISTS.forEach(([key,pl,title])=>{const ks=new Map();days.forEach(d=>(d.K[key]||[]).forEach(e=>{if(norm(e[0]).includes(q)){const m=ks.get(e[0])||{};m[d.date]=e[1];ks.set(e[0],m)}}));ks.forEach((m,k)=>rows.push({pl,title,k,m}))});
  $('findCs').textContent=`"${ST.q.trim()}"가 들어간 검색어의 날짜별 순위 · ${ds.length?md(ds[0])+' ~ '+md(ds[ds.length-1]):''}`;
  $('find').innerHTML=rows.length?`<table><thead><tr><th class="k">플랫폼 · 검색어</th>${days.map(d=>`<th>${md(d.date)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td class="k"><a href="${esc(link(r.pl,r.k))}" target="_blank" rel="noopener">${esc(r.pl)} ${r.title.startsWith('급상승')?'급상승':''} · ${esc(r.k)}</a></td>${days.map(d=>`<td>${r.m[d.date]?`<span class="n${r.m[d.date]<=3?' t3':''}">${r.m[d.date]}</span>`:'<span class="mu">–</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">이 기간 인기 검색어에 없어요.</div>';
}
$('modes').onclick=e=>{const b=e.target.closest('[data-m]');if(b){ST.mode=b.dataset.m;load()}};
$('psel').onchange=e=>{if(ST.mode==='week')ST.week=e.target.value;else ST.month=e.target.value;load()};
$('dpick').onchange=e=>{ST.date=e.target.value||LD;load()};
$('dprev').onclick=()=>{const i=DATES.indexOf(ST.dateUsed);if(i>0){ST.date=DATES[i-1];load()}};
$('dnext').onclick=()=>{const i=DATES.indexOf(ST.dateUsed);if(i<DATES.length-1){ST.date=DATES[i+1];load()}};
$('dlatest').onclick=()=>{ST.date=LD;load()};
$('cols').onclick=e=>{const b=e.target.closest('.more');if(b){ST.open[b.dataset.k]=!ST.open[b.dataset.k];render()}};
let t;$('q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{ST.q=e.target.value;render()},250)};
load();
})();
</script>
</body></html>
