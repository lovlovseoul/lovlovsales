<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>예약발송 현황</title>
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--line:#E7E9ED;--line2:#D9DDE3;--ink:#1A1D21;--ink2:#5B6470;--ink3:#9AA3AD;--accent:#EA5529;--accent-tint:#FDEEE9;--accent-ink:#B83D18;--good:#16A34A;--good-tint:#E8F6EC;--warn:#B45309;--warn-tint:#FEF3C7;--info:#2563EB;--info-tint:#EAF1FE;--hover:#F0F2F5;
--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1280px;padding:24px 28px 56px;display:flex;flex-direction:column;gap:14px}
.hd h1{font-size:22px;letter-spacing:-.02em}
.hd p{color:var(--ink2);margin-top:3px;font-size:13px}
.fresh{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fresh span{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;color:var(--ink2)}
.fresh span.old{border-color:#F5C26B;background:var(--warn-tint);color:var(--warn);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.st{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}.st:hover{border-color:var(--ink3)}.st.on{border-color:var(--accent,#EA5529);box-shadow:0 0 0 1px var(--accent,#EA5529)}.st em{font-style:normal;font-size:11px;color:var(--ink3);float:right}
#statDet .sd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 4px}#statDet h4{margin:0 0 8px;font-size:13.5px}#statDet table{width:100%;border-collapse:collapse;font-size:12.5px}#statDet td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}#statDet td.n{white-space:nowrap}#statDet .go{cursor:pointer;color:var(--info,#2563EB)}
.st small{display:block;font-size:11.5px;color:var(--ink3)}
.st b{font-size:20px}
.st span{font-size:12px;color:var(--ink2);margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>h2{font-size:15px;padding:13px 16px 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card>h2 small{font-size:12px;color:var(--ink3);font-weight:400}
.card>.sub{padding:0 16px 10px;color:var(--ink2);font-size:12.5px}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
.flags .fl{white-space:nowrap}
td.nm{min-width:170px}
th{background:var(--bg);font-size:11.5px;color:var(--ink3);font-weight:600;text-align:center;padding:8px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line2);white-space:nowrap}
th.l,td.l{text-align:left;padding-left:16px}
td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center;vertical-align:middle}
tr.p{cursor:pointer}tr.p:hover td{background:var(--hover)}
tr.p.open td{background:var(--accent-tint)}
.nm b{font-weight:600}.nm small{display:block;color:var(--ink3);font-size:11px}
.c{display:inline-block;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;white-space:nowrap}
.c.rv{background:var(--accent-tint);color:var(--accent-ink)}
.c.gen{background:var(--good-tint);color:var(--good);font-weight:600}
.c.none{background:var(--warn-tint);color:var(--warn);font-weight:600}
.c.unk{color:var(--ink3);font-weight:600}
.c.na{color:var(--line2)}
.num{font-weight:700}
.num.bad{color:var(--accent-ink)}
.flags{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left}
.fl{font-size:11.5px;border-radius:5px;padding:1px 6px;line-height:1.5}
.fl.r{background:var(--accent-tint);color:var(--accent-ink)}
.fl.w{background:var(--warn-tint);color:var(--warn)}
.fl.i{background:var(--info-tint);color:var(--info)}
tr.det td{background:#FBFBFC;text-align:left;padding:10px 16px 14px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.dc{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:8px 10px;font-size:12.5px}
.dc h4{font-size:12.5px;display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.dc p{color:var(--ink2);font-size:12px}
.sbox{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 11px;font-size:12.5px}
.sbox h4{font-size:12.5px;margin-bottom:4px}
.sbox li{list-style:none;color:var(--ink2);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink2);background:var(--card)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.inl{font-size:12px;color:var(--ink2);white-space:nowrap}
.inl i{font-style:normal;color:var(--ink3)}
.cal{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:92px 1fr;border-top:1px solid var(--line)}
.day .dt{padding:9px 0 9px 16px;font-weight:700;font-size:13px}
.day .dt small{display:block;font-weight:400;color:var(--ink3);font-size:11px}
.day.today .dt{color:var(--accent)}
.day .ev{padding:8px 16px 8px 0;display:flex;flex-direction:column;gap:4px}
.e{font-size:12.5px}
.e .k{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px}
.e .k.s{background:var(--accent-tint);color:var(--accent-ink)}
.e .k.in{background:var(--good-tint);color:var(--good)}
.note{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.65}
.empty{padding:24px;text-align:center;color:var(--ink3)}
@media(max-width:700px){.wrap{padding:16px 14px 40px}.day{grid-template-columns:70px 1fr}}
</style></head>
<body>
<div class="wrap">
 <div class="hd"><h1>예약발송 현황</h1>
  <p>채널별 예약 발송일 · 미송(재고 없이 주문 들어온 수량) · 입고 일정을 한 화면에서</p>
  <div class="fresh" id="fresh"></div></div>
 <div class="stats" id="stats"></div>
 <div id="statDet"></div>

 <div class="card"><h2>채널별 예약 발송일 <small>상품을 누르면 채널별 안내 문구 · 미송 · 입고 일정</small></h2>
  <div class="sub"><span class="c rv">12/9</span> 예약 발송일 &nbsp; <span class="c gen">일반</span> 일반 발송 &nbsp; <span class="c none">표기 없음</span> 예약 표기 안 됨 &nbsp; <span class="c unk">?</span> 확인 못 함 &nbsp; <span class="c na">—</span> 미등록</div>
  <div class="tw"><table><thead><tr id="thA"></tr></thead><tbody id="tbA"></tbody></table></div></div>

 <div class="card"><h2>미송 <small>이지어드민 송장 &gt; 재고 · 입고 예정으로 언제 풀리는지</small></h2>
  <div class="tools" id="brandChips"></div>
  <div class="tw"><table><thead><tr><th class="l">상품 · 옵션</th><th>재고</th><th>송장</th><th>미송</th><th class="l">입고 예정</th><th>예상 해소</th><th class="l">채널 예약 표기</th></tr></thead><tbody id="tbB"></tbody></table></div></div>

 <div class="card"><h2>날짜별 일정 <small>오늘부터 3주 · 채널 발송 시작일과 입고 예정일</small></h2>
  <div class="cal" id="cal"></div></div>

 <div class="note" id="note"></div>
</div>
<script>
const CH=[['wconcept','W컨셉'],['29cm','29CM'],['musinsa','무신사'],['zigzag','지그재그'],['lotteon','롯데온'],['ssf','SSF'],['queenit','퀸잇'],['own','자사몰']];
const CHN=Object.fromEntries(CH);
const LINK={wconcept:'https://www.wconcept.co.kr/Product/{}','29cm':'https://product.29cm.co.kr/catalog/{}',musinsa:'https://www.musinsa.com/products/{}',zigzag:'https://zigzag.kr/catalog/products/{}',lotteon:'https://www.lotteon.com/p/product/{}',ssf:'https://www.ssfshop.com/LOVLOV/{}/good',queenit:'https://web.queenit.kr/product/{}',own:'https://lovlovseoul.com/product/detail.html?product_no={}'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=s=>String(s||'').toLowerCase().replace(/\(s\/s\s*ver\.?\)/g,'ss').replace(/[\s()._]/g,'');
const md=d=>{if(!d)return '';const [y,m,dd]=d.slice(0,10).split('-');return (+m)+'/'+(+dd);};
const WD='일월화수목금토';
const today=new Date();today.setHours(0,0,0,0);
const dOf=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const daysAgo=s=>{if(!s)return null;return Math.round((today-dOf(s))/864e5);};
let PRE={items:[],scan:{}},STK=null,brand='전체',openK=null,statK=null;

async function load(){
  const v='?v='+Date.now();
  try{PRE=await fetch('preorder.json'+v).then(r=>r.json());}catch(e){}
  try{STK=await fetch('stock.json'+v).then(r=>r.json());}catch(e){STK=null;}
  build();
}
function stockOpts(name,opt){ // 같은 상품의 옵션들 (opt 있으면 그 컬러만)
  if(!STK)return [];const k=nk(name);
  const key=Object.keys(STK.P).find(x=>nk(x)===k);if(!key)return [];
  return STK.P[key].o.filter(o=>!opt||nk(o.c)===nk(opt)).map(o=>({...o,p:key,b:STK.P[key].b}));
}
function cover(o){ // 미송을 입고로 언제 메우는지
  const need=-o.av;if(need<=0)return {txt:'',ok:true};
  const ins=(o.in||[]).filter(i=>!i.stale).slice().sort((a,b)=>(a.eta||'9999')<(b.eta||'9999')?-1:1);
  let sum=0;for(const i of ins){sum+=i.q;if(sum>=need)return i.eta?{txt:md(i.eta),eta:i.eta,ok:true}:{txt:'날짜 미정',ok:true,und:true};}
  return {txt:ins.length?`${need-sum}장 부족`:'입고 일정 없음',ok:false};
}
function inList(o){return (o.in||[]).map(i=>`<span class="inl">${i.q}장 ${i.eta?md(i.eta):'<i>미정</i>'}${i.rd?` <i>${esc(i.rd)}</i>`:''}${i.stale?' <i>(지남)</i>':''}</span>`).join('<br>')||'<span class="inl"><i>없음</i></span>';}

function itemFlags(it,opts){
  const F=[];const reg=CH.filter(([k])=>it.ch[k]&&it.ch[k].s!=='na');
  const rv=reg.filter(([k])=>it.ch[k].s==='rv'&&it.ch[k].d);
  const plain=reg.filter(([k])=>['gen','none'].includes(it.ch[k].s));
  const ds=[...new Set(rv.map(([k])=>it.ch[k].d))].sort();
  if(ds.length>1)F.push(['w',`채널마다 날짜 다름 (${ds.map(md).join(' · ')})`]);
  const mis=opts.reduce((a,o)=>a+Math.max(0,-o.av),0);
  if(rv.length&&plain.length)F.push([mis>0?'r':'w',`${plain.map(([k])=>CHN[k]).join('·')}는 예약 표기 없이 판매 중${mis>0?' (미송 있음)':''}`]);
  if(mis>0){opts.filter(o=>o.av<0).forEach(o=>{const c=cover(o);if(!c.ok)F.push(['r',`${o.c} ${c.txt}`]);else if(c.eta&&ds.length&&c.eta>ds[0])F.push(['r',`${o.c} 입고(${md(c.eta)})가 발송일(${md(ds[0])})보다 늦음`]);});}
  if(STK&&daysAgo(STK.asof)<2&&rv.length&&opts.length&&mis===0&&opts.every(o=>o.av>0))F.push(['i','재고상 미송 없음 — 예약 해제 검토']);
  return F;
}
function cellA(e,k){
  if(!e||e.s==='na')return '<span class="c na">—</span>';
  if(e.s==='rv')return `<span class="c rv">${e.d?md(e.d):'예약'}</span>`;
  if(e.s==='gen')return '<span class="c gen">일반</span>';
  if(e.s==='none')return '<span class="c none">표기 없음</span>';
  return '<span class="c unk">?</span>';
}
function build(){
  const stale=STK?daysAgo(STK.asof):null;
  const fr=[`<span>채널 발송일 ${esc(PRE.asof||'-')}</span>`];
  fr.push(STK?`<span class="${stale>=1?'old':''}">재고(이지어드민) ${esc(STK.asof)}${stale>=1?` · ${stale}일 전`:''}</span>`:'<span class="old">재고 파일 없음</span>');
  if(STK&&STK.inbAsof)fr.push(`<span class="${daysAgo(STK.inbAsof)>=3?'old':''}">입고 일정 ${esc(STK.inbAsof)}</span>`);
  document.getElementById('fresh').innerHTML=fr.join('');

  // A
  const items=PRE.items.map(it=>({...it,opts:stockOpts(it.name,it.opt)}));
  items.forEach(it=>{it.mis=it.opts.reduce((a,o)=>a+Math.max(0,-o.av),0);it.F=itemFlags(it,it.opts);it.first=CH.map(([k])=>it.ch[k]).filter(e=>e&&e.s==='rv'&&e.d).map(e=>e.d).sort()[0]||'9999';});
  items.sort((a,b)=>a.first<b.first?-1:a.first>b.first?1:b.mis-a.mis);
  document.getElementById('thA').innerHTML='<th class="l">상품</th><th title="이지어드민 재고 기준일 기준">미송'+(STK&&daysAgo(STK.asof)>=1?`<br><span style="font-weight:400">${md(STK.asof)} 기준</span>`:'')+'</th>'+CH.map(([,l])=>`<th>${l}</th>`).join('')+'<th class="l">확인</th>';
  const tbA=document.getElementById('tbA');
  tbA.innerHTML=items.length?items.map((it,ix)=>{const op=openK==='a'+ix;
    return `<tr class="p${op?' open':''}" data-k="a${ix}"><td class="l nm"><b>${esc(it.name)}</b>${it.opt?`<small>${esc(it.opt)}</small>`:''}</td><td><span class="num${it.mis>0?' bad':''}">${STK?(it.opts.length?it.mis:'<span class="c unk">?</span>'):'-'}</span></td>`+CH.map(([k])=>`<td>${cellA(it.ch[k],k)}</td>`).join('')+`<td class="l"><div class="flags">${it.F.map(([t,s])=>`<span class="fl ${t}">${esc(s)}</span>`).join('')||'<span class="inl"><i>-</i></span>'}</div></td></tr>`+(op?detA(it):'');}).join(''):`<tr><td colspan="${CH.length+3}" class="empty">예약 걸린 상품 없음</td></tr>`;

  // B
  const mis=[];if(STK)for(const [p,v] of Object.entries(STK.P))for(const o of v.o)if(o.sj>0&&o.av<0)mis.push({...o,p,b:v.b});
  mis.sort((a,b)=>a.av-b.av);
  const brands=['전체',...new Set(mis.map(o=>o.b))];
  document.getElementById('brandChips').innerHTML=brands.map(b=>`<button class="chip${b===brand?' on':''}" data-b="${esc(b)}">${esc(b)} ${b==='전체'?mis.length:mis.filter(o=>o.b===b).length}</button>`).join('')+(stale>=1?`<span class="fl w">재고 ${stale}일 전 기준 — 지금은 달라졌을 수 있음</span>`:'');
  const L=mis.filter(o=>brand==='전체'||o.b===brand);
  document.getElementById('tbB').innerHTML=!STK?'<tr><td colspan="7" class="empty">stock.json을 못 읽음</td></tr>':L.length?L.map(o=>{const c=cover(o);const it=PRE.items.find(x=>nk(x.name)===nk(o.p)&&(!x.opt||nk(x.opt)===nk(o.c)));
    const rvN=it?CH.filter(([k])=>it.ch[k]&&it.ch[k].s==='rv').length:0,regN=it?CH.filter(([k])=>it.ch[k]&&it.ch[k].s!=='na').length:0;
    const chTxt=it?(rvN?`<span class="fl ${rvN<regN?'w':'i'}">예약 ${rvN}/${regN}채널</span>`:'<span class="fl r">예약 표기 없음</span>'):(o.b==='레세터'?(()=>{const al=(STK.alerts||[]).find(a=>a.p===o.p&&a.c===o.c&&a.s===o.s);return al&&al.rsv?`<span class="fl i">무신사 예약 ${md(al.rsv)}</span>`:'<span class="fl r">무신사 예약 표기 없음</span>';})():'<span class="fl r">예약 표기 없음</span>');
    return `<tr><td class="l nm"><b>${esc(o.p)}</b><small>${esc(o.b)} · ${esc(o.c)} / ${esc(o.s)}</small></td><td>${o.st}</td><td>${o.sj}</td><td><span class="num bad">${-o.av}</span></td><td class="l">${inList(o)}</td><td>${c.ok?`<span class="c ${c.und?'none':'gen'}">${esc(c.txt)}</span>`:`<span class="fl r">${esc(c.txt)}</span>`}</td><td class="l">${chTxt}</td></tr>`;}).join(''):'<tr><td colspan="7" class="empty">미송 없음</td></tr>';

  // C
  const ev={};const add=(d,h)=>{if(!d)return;(ev[d.slice(0,10)]=ev[d.slice(0,10)]||[]).push(h);};
  items.forEach(it=>{const by={};CH.forEach(([k,l])=>{const e=it.ch[k];if(e&&e.s==='rv'&&e.d)(by[e.d]=by[e.d]||[]).push(l);});Object.entries(by).forEach(([d,ls])=>add(d,`<div class="e"><span class="k s">발송 시작</span>${esc(it.name)}${it.opt?' '+esc(it.opt):''} <span class="inl"><i>${ls.join('·')}</i></span></div>`));});
  if(STK)for(const [p,v] of Object.entries(STK.P))for(const o of v.o)for(const i of (o.in||[]))if(i.eta&&!i.stale&&(o.av<0||o.sj>0))add(i.eta,`<div class="e"><span class="k in">입고</span>${esc(p)} ${esc(o.c)}${o.s!=='FREE'&&o.s!=='ONE SIZE'?' '+esc(o.s):''} ${i.q}장 <span class="inl"><i>${esc(i.rd||'')}${o.av<0?` · 미송 ${-o.av}`:''}</i></span></div>`);
  const days=[];for(let n=-7;n<21;n++){const d=new Date(today);d.setDate(d.getDate()+n);const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(ev[s]&&(n>=0||ev[s]))days.push([s,d,n]);}
  const past=days.filter(x=>x[2]<0),fut=days.filter(x=>x[2]>=0);
  document.getElementById('cal').innerHTML=(fut.length||past.length)?[...past.map(x=>[...x,true]),...fut.map(x=>[...x,false])].map(([s,d,n,p])=>`<div class="day${n===0?' today':''}"${p?' style="opacity:.55"':''}><div class="dt">${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})<small>${n===0?'오늘':n<0?`${-n}일 전 · 지남`:`${n}일 후`}</small></div><div class="ev">${ev[s].join('')}</div></div>`).join(''):'<div class="empty">3주 안에 잡힌 일정 없음</div>';

  // stats
  const rvItems=items.filter(it=>CH.some(([k])=>it.ch[k]&&it.ch[k].s==='rv'));
  const misSum=mis.reduce((a,o)=>a-o.av,0);
  const nf=items.filter(it=>it.F.some(f=>f[0]==='r')).length;
  const noIn=mis.filter(o=>!cover(o).ok).length;
  const card=(k,lab,val,unit)=>`<button type="button" class="st${statK===k?' on':''}" data-st="${k}"><small>${lab}<em>${statK===k?'닫기 ▲':'목록 ▼'}</em></small><b>${val}</b><span>${unit}</span></button>`;
  document.getElementById('stats').innerHTML=card('rv','예약 걸린 상품 (채널 기준)',rvItems.length,'개')+card('mis',`미송 옵션${stale>=1?` (재고 ${stale}일 전)`:''}`,STK?mis.length:'-',STK?`옵션 · ${misSum.toLocaleString()}장`:'')+card('noin','입고로 못 메우는 미송',STK?noIn:'-','옵션')+card('red','확인 필요 (빨간 표시)',nf,'상품');
  const optTxt=o=>`${esc(o.c)}${o.s&&o.s!=='FREE'&&o.s!=='ONE SIZE'?' / '+esc(o.s):''}`;
  const go=ix=>` <span class="go" data-go="a${ix}">표에서 보기</span>`;
  let sd='';
  if(statK==='rv')sd=`<h4>예약 걸린 상품 ${rvItems.length}개 — 채널별 발송일</h4><table>`+rvItems.map(it=>{const ix=items.indexOf(it);const ds=CH.filter(([k])=>it.ch[k]&&it.ch[k].s==='rv').map(([k,l])=>`${l} ${it.ch[k].d?md(it.ch[k].d):'예약'}`).join(' · ');return `<tr><td class="n"><b>${esc(it.name)}</b>${it.opt?' '+esc(it.opt):''}</td><td>${ds}</td><td class="n">미송 ${it.mis}${go(ix)}</td></tr>`}).join('')+'</table>';
  if(statK==='mis')sd=`<h4>미송 옵션 ${mis.length}개 · ${misSum.toLocaleString()}장</h4><table>`+mis.map(o=>{const c=cover(o);return `<tr><td class="n"><b>${esc(o.p)}</b> <span class="inl"><i>${esc(o.b)}</i></span></td><td class="n">${optTxt(o)}</td><td class="n">미송 <b>${-o.av}</b></td><td>${c.ok?'해소 '+esc(c.txt):'<span class="fl r">'+esc(c.txt)+'</span>'}</td></tr>`}).join('')+'</table>';
  if(statK==='noin'){const L=mis.filter(o=>!cover(o).ok);sd=`<h4>입고로 못 메우는 미송 ${L.length}개</h4><table>`+(L.map(o=>{const c=cover(o);const q=(o.in||[]).filter(i=>!i.stale).reduce((a,i)=>a+i.q,0);return `<tr><td class="n"><b>${esc(o.p)}</b> <span class="inl"><i>${esc(o.b)}</i></span></td><td class="n">${optTxt(o)}</td><td class="n">미송 <b>${-o.av}</b> · 입고 예정 ${q}장</td><td><span class="fl r">${esc(c.txt)}</span></td></tr>`}).join('')||'<tr><td>없음</td></tr>')+'</table>';}
  if(statK==='red'){const L=items.filter(it=>it.F.some(f=>f[0]==='r'));sd=`<h4>확인 필요 ${L.length}개 상품</h4><table>`+(L.map(it=>{const ix=items.indexOf(it);return `<tr><td class="n"><b>${esc(it.name)}</b>${it.opt?' '+esc(it.opt):''}</td><td><div class="flags">${it.F.filter(f=>f[0]==='r').map(([t,s])=>`<span class="fl r">${esc(s)}</span>`).join('')}</div></td><td class="n">${go(ix)}</td></tr>`}).join('')||'<tr><td>없음</td></tr>')+'</table>';}
  document.getElementById('statDet').innerHTML=sd?`<div class="sd">${sd}</div>`:'';
  const sc=PRE.scan||{};
  document.getElementById('note').innerHTML=`· <b>채널 발송일</b>은 각 채널 공개 상품 페이지 기준 (${esc(PRE.asof||'')} 수집)<br>`+CH.map(([k,l])=>`&nbsp;&nbsp;– ${l}: ${esc(sc[k]||'-')}`).join('<br>')+`<br>· <b>미송</b> = 이지어드민 송장 − 정상재고 (가용재고가 마이너스인 옵션). 이지어드민 파일을 받은 날 갱신됨<br>· <b>입고 예정</b>은 입출고 시트 · 중국 사입 보드 · 국주 전달 일정에서 가져옴. 예정일 3일 넘게 지난 건은 (지남) 표시하고 계산에서 뺌<br>· <b>예상 해소</b> = 입고 예정 수량을 날짜순으로 더해서 미송을 다 채우는 날 (물류 출고 하루 이틀은 별도)`;
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-st]');if(s){statK=statK===s.dataset.st?null:s.dataset.st;build();return;}const g=e.target.closest('[data-go]');if(g){openK=g.dataset.go;build();const r=document.querySelector(`tr[data-k="${openK}"]`);if(r)r.scrollIntoView({behavior:'smooth',block:'center'});return;}const b=e.target.closest('[data-b]');if(b){brand=b.dataset.b;build();return;}
  const tr=e.target.closest('tr.p');if(tr&&!e.target.closest('a')){openK=openK===tr.dataset.k?null:tr.dataset.k;build();}});
function detA(it){
  const cards=CH.map(([k,l])=>{const e=it.ch[k]||{s:'na'};if(e.s==='na')return '';
    const lk=e.i?`<a href="${LINK[k].replace('{}',encodeURIComponent(e.i))}" target="_blank" rel="noopener">상품 페이지</a>`:'';
    return `<div class="dc"><h4><span>${l} ${cellA(e,k)}</span>${lk}</h4><p>${esc(e.t||(e.s==='unk'?'발송일 확인 못 함':''))}</p></div>`;}).join('');
  const st=it.opts.length?`<div class="sbox"><h4>재고 · 미송 · 입고 ${STK?`<span class="inl"><i>(재고 ${esc(STK.asof)})</i></span>`:''}</h4><ul>`+it.opts.map(o=>{const c=cover(o);return `<li><b>${esc(o.c)} ${esc(o.s)}</b> — 재고 ${o.st} · 송장 ${o.sj} · ${o.av<0?`<b style="color:var(--accent-ink)">미송 ${-o.av}</b>`:`가용 ${o.av}`}${(o.in||[]).length?` · 입고 ${(o.in||[]).map(i=>`${i.q}장 ${i.eta?md(i.eta):'미정'}${i.rd?'('+esc(i.rd)+')':''}`).join(', ')}`:''}${o.av<0?` → 해소 ${esc(c.txt)}`:''}</li>`;}).join('')+'</ul></div>':(STK?'<div class="sbox"><h4>재고 · 미송 · 입고</h4><ul><li>재고 파일에서 이 상품을 못 찾음 (재고 파일 이후 등록된 상품일 수 있음)</li></ul></div>':'');
  return `<tr class="det"><td colspan="${CH.length+3}"><div class="dg">${cards}</div>${st}</td></tr>`;
}
load();
</script>
</body></html>
