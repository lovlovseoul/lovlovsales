<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로브로브 통합 대시보드</title>
<style>
:root{--surface-0:#F4F5F7;--surface-1:#FFFFFF;--line:#E7E9ED;--text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface-0);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;gap:18px;padding:12px 26px;background:var(--surface-1);border-bottom:1px solid var(--line)}
.logo{font-size:15px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--text-3);font-weight:600;margin-left:6px;font-size:13px}
nav{display:inline-flex;gap:3px;background:var(--surface-0);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{font:inherit;font-size:14px;font-weight:700;padding:8px 22px;border-radius:7px;border:none;background:none;color:var(--text-2);cursor:pointer}
nav button:hover{color:var(--text-1)}
nav button.on{background:var(--text-1);color:#fff}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface-0);display:none}
.frames iframe.on{display:block}
@media(max-width:640px){.bar{padding:10px 12px;gap:10px}.logo span{display:none}nav button{padding:7px 14px;font-size:13px}}
</style></head>
<body>
<div class="bar">
  <div class="logo">LOVLOV<span>통합 대시보드</span></div>
  <nav id="tabs">
    <button data-t="sales">판매</button>
    <button data-t="returns">반품</button>
    <button data-t="ranking">랭킹</button>
  </nav>
</div>
<div class="frames" id="frames"></div>
<script>
const PAGES={sales:'sales.html',returns:'returns.html',ranking:'ranking.html'};
const frames=document.getElementById('frames'), loaded={};
function show(t){
  if(!PAGES[t]) t='sales';
  if(!loaded[t]){const f=document.createElement('iframe');f.src=PAGES[t]+'?v='+Date.now();f.title=t;frames.append(f);loaded[t]=f;}
  for(const k in loaded) loaded[k].classList.toggle('on',k===t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(location.hash!=='#'+t) history.replaceState(null,'','#'+t);
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'sales');
</script>
</body></html>
