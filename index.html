<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:'Segoe UI',Arial,'Malgun Gothic',sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
header{margin-bottom:20px}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--text-3);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px;background:var(--surface-1);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--text-1);color:#000;border-color:var(--text-1)}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.daychip{padding:6px 11px;border-radius:8px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;transition:.12s}
.daychip:hover{background:#2c2c2a}
.daychip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .lab{color:var(--text-3);font-size:12px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .sub2{color:var(--text-3);font-size:11px;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:14px}
.legend{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.lg .dot{width:11px;height:11px;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--text-3);font-weight:600;font-size:11px}
td.n,th.n{text-align:left}
tr:last-child td{border-bottom:none}
.rank{color:var(--text-3);width:24px}
.r1 td{color:#fff;font-weight:700}
.new{color:var(--C);font-size:10px;font-weight:700;margin-left:5px}
.bar-row td{padding:5px 8px}
.mini{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
svg text{font-family:inherit}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:#fff;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}

function render(){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',TABS[i]==cur));
  const isC=cur=='전체통합';
  const src=isC?D.combined:D.byPlat[cur];

  const nd=D.days.length;

    ['총 실결제금액',won(src.periodAmt),'기간 '+nd+'일 합계'],
    ['총 판매량',src.periodQty.toLocaleString()+'장',''],
    ['주문 건수',src.periodOrders.toLocaleString()+'건',''],

  ];

function renderDayTop(){
  const isC=cur=='전체통합';
  const src=isC?D.combined:D.byPlat[cur];
  const list=(src.dayTop&&src.dayTop[curDay])?src.dayTop[curDay]:[];
  const dayAmt=list.reduce((s,t)=>s+t.amt,0);
  document.querySelectorAll('.daychip').forEach(b=>b.classList.toggle('on',b.dataset.day==curDay));
  let h='';
  if(!list.length){ h='<div class="cs" style="padding:8px 0">해당 날짜 판매 없음</div>'; }
  else{
    h='<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>';
    list.forEach((t,i)=>{
      const share=dayAmt?(t.amt/dayAmt*100).toFixed(1):'0.0';
      h+=`<tr class="${i==0?'r1':''}"><td class="n"><span class="rank">${i+1}</span>${t.name}${isNew(t.name)?'<span class="new">NEW</span>':''}</td><td>${t.qty}</td><td>${won(t.amt)}</td><td>${share}%</td></tr>`;
    });
    h+='</table>';
  }
  const el=document.getElementById('dayTopTable'); if(el) el.innerHTML=h;
}

function dailyChart(isC,src){

      s+=`<rect class="hb" data-t="${dlab(d)}" data-v="${won(v)}" x="${cx-bwid/2}" y="${H-PB-hh}" width="${bwid}" height="${Math.max(hh,0)}" rx="3" fill="${PCH[cur]}"/>`;
    }
    // total label
    s+=`<text x="${cx}" y="${y(totals[i])-6}" fill="var(--text-2)" font-size="10.5" font-weight="700" text-anchor="middle">${Math.round(totals[i]/1000)}K</text>`;
    s+=`<text x="${cx}" y="${H-PB+16}" fill="var(--text-3)" font-size="11" text-anchor="middle">${dlab(d)}</text>`;

  s+=`</svg>`;
  let leg='';
  if(isC){leg=`<div class="legend">`+D.platforms.map(p=>`<div class="lg"><span class="dot" style="background:${PCH[p]}"></span>${p}</div>`).join('')+`</div>`;}
  return leg+s;
}

function shareChart(){
  const tot=D.combined.periodAmt;
  const parts=D.platforms.map(p=>({p,v:D.byPlat[p].periodAmt}));
  const W=1080,H=54; let x=0; let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  parts.forEach(pt=>{const w=(W-2*(parts.length-1))*(pt.v/tot); 
    s+=`<rect class="hb" data-t="${pt.p}" data-v="${won(pt.v)} · ${(pt.v/tot*100).toFixed(1)}%" x="${x}" y="10" width="${Math.max(w,0)}" height="30" rx="5" fill="${PCH[pt.p]}"/>`;
    if(w>60)s+=`<text x="${x+w/2}" y="30" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${pt.p} ${(pt.v/tot*100).toFixed(0)}%</text>`;
    x+=w+2;});
  s+=`</svg>`;
  return s;
}

function topBars(top,barcol){
  const max=Math.max(...top.map(t=>t.amt));
  const rows=top.slice(0,10);
  const W=1080,rh=30,H=rows.length*rh+8,PL=4,barX=150,PR=70;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  rows.forEach((t,i)=>{
    const yy=i*rh+6; const w=(W-barX-PR)*(t.amt/max);
    const nm=t.name.replace(/_\(\dcolor\)/,'');
    s+=`<text x="${PL}" y="${yy+15}" fill="var(--text-2)" font-size="11.5" >${i+1}. ${nm.length>13?nm.slice(0,13)+'…':nm}</text>`;
    s+=`<rect class="hb" data-t="${nm}" data-v="${won(t.amt)} · ${t.qty}장" x="${barX}" y="${yy+3}" width="${Math.max(w,2)}" height="16" rx="4" fill="${i==0?'#fff':barcol}"/>`;
    s+=`<text x="${barX+w+8}" y="${yy+15}" fill="var(--text-3)" font-size="11">${Math.round(t.amt/1000)}K</text>`;
  });
  s+=`</svg>`;
  return s;
}

const NEWSET=new Set(['뮤즈 브이넥 탑','데일리 브리즈 밴딩 팬츠','썬릿 스트라이프 셔츠','클라우드 체크 셔츠','조이풀 스트라이프 팬츠','컬러 팝 가디건','소프트 브리즈 가디건','써머 슬럽 스트라이프 티','에어 시어 윈드브레이커','크로셰 쿨 밴딩 스커트']);
function isNew(n){return NEWSET.has(n.replace(/_\(\dcolor\)/,''));}
function topTable(top,tot){
  let h=`<table><tr><th class="n">순위 · 상품</th><th>수량</th><th>실결제</th><th>비중</th></tr>`;
  top.slice(0,12).forEach((t,i)=>{
    const nm=t.name.replace(/_\(\dcolor\)/,'');
    h+=`<tr class="${i==0?'r1':''}"><td class="n"><span class="rank">${i+1}</span>${nm}${isNew(t.name)?'<span class="new">NEW</span>':''}</td><td>${t.qty}</td><td>${won(t.amt)}</td><td>${(t.amt/tot*100).toFixed(1)}%</td></tr>`;
  });
  h+=`</table>`;return h;
}

function attachHovers(){
  document.querySelectorAll('.hb').forEach(el=>{
    el.style.cursor='pointer';
    el.addEventListener('mousemove',e=>showTip(e,`<b>${el.dataset.t}</b><br>${el.dataset.v}`));
    el.addEventListener('mouseleave',hideTip);
  });
}
render();
</script></body></html>
