<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 브랜드 랭킹</title>
<style>
:root{--surface-0:#F4F5F7;--surface-1:#FFFFFF;--surface-2:#FAFBFC;--line:#E7E9ED;--line-2:#DCDFE4;--text-1:#1A1D21;--text-2:#5B6470;--text-3:#9AA3AD;--accent:#EA5529;--accent-soft:#FDEEE9;--up:#1F8A5B;--down:#D64545;--own:#F2A93B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px 26px 70px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
.view{display:inline-flex;gap:3px;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.view a{font-size:13px;font-weight:700;padding:7px 16px;border-radius:7px;color:var(--text-2);text-decoration:none}
.view a.on{background:var(--accent);color:#fff}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.6}
.sub b{color:var(--text-1)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:14px 0 0;padding:10px 12px;background:var(--surface-1);border:1px solid var(--line);border-radius:12px}
.seg{display:inline-flex;gap:3px;background:var(--surface-0);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:7px;border:none;background:none;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--text-1);color:#fff}
.bar input[type=date]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--text-1)}
.nb{font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text-2);cursor:pointer}
.nb:disabled{opacity:.4;cursor:default}
.nb.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.di{font-size:12px;color:var(--text-3)}.di b{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.card .cs{color:var(--text-3);font-size:11.5px;margin-bottom:14px}
.plat{font-size:12px;font-weight:700;color:var(--text-2);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.plat:first-of-type{margin-top:0}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media(max-width:520px){.items{grid-template-columns:1fr}}
.it{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.it .ph{display:block;width:76px;height:92px;border-radius:7px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.it .ph img{width:100%;height:100%;object-fit:cover;display:block}
.it .br{font-size:11.5px;font-weight:700;color:var(--own)}
.it .nm{font-size:12.5px;font-weight:600;line-height:1.35;margin-top:1px;color:var(--text-1);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{font-size:11.5px;color:var(--text-3);margin-top:2px}
.it .pr b{color:var(--accent)}
.pl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.pill b{color:var(--text-1)}
.pill.top{border-color:var(--own);background:#FFF6E8}
.up{color:var(--up)}.down{color:var(--down)}.nw{color:var(--accent);font-weight:700}.mu{color:var(--text-3)}
.empty{color:var(--text-3);font-size:12.5px;padding:8px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--text-3);font-weight:600;font-size:11.5px}
td.n,th.n{text-align:left;white-space:normal;min-width:200px}
td.n small{display:block;color:var(--text-3)}
td .c{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-weight:700}
.h1{background:#FCE3C2}.h2{background:#FFF1DD}.h3{background:#F7F8FA;color:var(--text-2)}
.note{color:var(--text-3);font-size:11.5px;margin:6px 0 0;line-height:1.5}
@media(max-width:820px){body{padding:18px 16px 56px}}
</style></head>
<body><div class="wrap">
<nav class="view"><a href="ranking.html">상품 랭킹</a><a href="keywords.html">검색어</a><a href="own.html" class="on">로브로브·레세터</a></nav>
<header><h1>로브로브·레세터 랭킹</h1><div class="sub" id="take">불러오는 중…</div></header>
<div class="bar">
  <div class="seg" id="brand"><button data-b="all">전체</button><button data-b="lov">로브로브</button><button data-b="les">레세터</button></div>
  <span><button class="nb" id="dprev" title="이전 기록일">◀</button> <input type="date" id="dpick" aria-label="조회 날짜"> <button class="nb" id="dnext" title="다음 기록일">▶</button> <button class="nb" id="dlatest">최신</button></span>
  <span class="di" id="dinfo"></span>
</div>
<div class="kpis" id="kpis"></div>
<section class="card">
  <h3>이 날 순위권에 오른 상품</h3>
  <div class="cs">플랫폼별 · 상품마다 오른 랭킹과 순위 · 괄호는 전날 대비 변동 · 진한 테두리는 TOP10 · 상품명을 누르면 상품 페이지가 열려요</div>
  <div id="list"></div>
</section>
<section class="card">
  <h3>날짜별 최고 순위</h3>
  <div class="cs">최근 14개 기록일 · 칸은 그날 그 상품이 오른 리스트 중 가장 높은 순위 · 빈칸은 순위권 밖</div>
  <div class="tw" id="hist"></div>
  <p class="note">무신사는 하루 한 번(새벽) 갱신, W컨셉·29CM는 오전·밤 두 번 수집해서 밤 값이 그날 최종이에요. 지그재그는 11/6 스냅샷 한 번뿐이라 날짜와 상관없이 따로 보여줘요.</p>
</section>
</div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'–':Number(n).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v='?v='+Date.now();
const IMG={ms_:'https://image.msscdn.net/images/goods_img/',wc_:'https://product-image.wconcept.co.kr/productimg/image/','29_':'https://img.29cm.co.kr/',zz_:'https://cf.product-image.s.zigzag.kr/original/'};
const URL_={ms_:'https://www.musinsa.com/products/',wc_:'https://www.wconcept.co.kr/Product/','29_':'https://www.29cm.co.kr/products/',zz_:'https://zigzag.kr/catalog/products/'};
const PL_ORDER=['무신사','W컨셉','29CM','지그재그'];
const LOV=['로브로브','lovlov'],LES=['레세터','lessetter'];
const has=(b,arr)=>arr.some(o=>(b||'').toLowerCase().includes(o));
const pre=pid=>pid.slice(0,3);
const imgOf=(pid,p)=>p&&p[5]?IMG[pre(pid)]+p[5]+(pre(pid)==='zz_'?'?width=400&height=400&quality=80&format=jpeg':''):'';
let IDX;try{IDX=await fetch('rank_index.json'+v).then(r=>r.json())}catch(e){$('take').textContent='랭킹 데이터를 불러오지 못했어요.';return}
const DATES=IDX.dates||[];const LD=DATES[DATES.length-1];
const CACHE={};const get=f=>CACHE[f]??=fetch(f+v).then(r=>r.ok?r.json():null).catch(()=>null);
const ST={b:'all',date:LD};
try{const s=JSON.parse(localStorage.getItem('own1')||'{}');if(s.b)ST.b=s.b}catch(e){}
const ZZ=IDX.zz?await get('rank_zz.json'):null;
const want=b=>ST.b==='all'?(has(b,LOV)||has(b,LES)):ST.b==='lov'?has(b,LOV):has(b,LES);
const label=(k)=>{const [pl,sec,cat,sub]=k.split('|');return (pl==='무신사'?sec+' › ':'')+cat+(sub&&sub!=='전체'?' › '+sub:'')};
// 하루 파일에서 우리 상품 → [{pid,p,plat,hits:[{k,lab,rank,prev}]}]
function collect(D,allowPrev){
  const M=new Map();if(!D)return M;
  for(const [k,lst] of Object.entries(D.L)){const plat=k.split('|')[0];
    for(const e of lst){const p=D.P[e[0]];if(!p||!want(p[0]))continue;
      const o=M.get(e[0])||{pid:e[0],p,plat,hits:[]};o.hits.push({k,lab:label(k),rank:e[1],prev:allowPrev&&e.length>2?e[2]:undefined});M.set(e[0],o)}}
  for(const o of M.values()){o.hits.sort((a,b)=>a.rank-b.rank);o.best=o.hits[0].rank}
  return M;
}
function chg(h){if(h.prev===undefined)return'';if(h.prev===null)return' <span class="nw">NEW</span>';const c=h.prev-h.rank;if(!c)return' <span class="mu">–</span>';return c>0?` <span class="up">▲${c}</span>`:` <span class="down">▼${-c}</span>`}
function item(o){const p=o.p;const u=URL_[pre(o.pid)]+o.pid.slice(3);const im=imgOf(o.pid,p);
  return `<div class="it"><a class="ph" href="${esc(u)}" target="_blank" rel="noopener">${im?`<img src="${esc(im)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`:''}</a>
  <div><div class="br">${esc(p[0])}</div><a class="nm" href="${esc(u)}" target="_blank" rel="noopener">${esc(p[1])}</a>
  <div class="pr">${p[4]?`<b>${p[4]}%</b> `:''}₩${fmt(p[2])}${p[6]?' · 품절':''}</div>
  <div class="pl">${o.hits.map(h=>`<span class="pill${h.rank<=10?' top':''}">${esc(h.lab)} <b>${h.rank}위</b>${chg(h)}</span>`).join('')}</div></div></div>`}
async function render(){
  try{localStorage.setItem('own1',JSON.stringify({b:ST.b}))}catch(e){}
  document.querySelectorAll('#brand button').forEach(b=>b.classList.toggle('on',b.dataset.b===ST.b));
  let d=ST.date;if(!DATES.includes(d)){const e=DATES.filter(x=>x<=d);d=e.length?e[e.length-1]:DATES[0]}ST.used=d;
  const i=DATES.indexOf(d);$('dpick').value=d;$('dpick').min=DATES[0];$('dpick').max=LD;$('dprev').disabled=i<=0;$('dnext').disabled=i>=DATES.length-1;$('dlatest').classList.toggle('on',d===LD);
  const D=await get('rankday_'+d+'.json');
  $('dinfo').innerHTML=(d===LD?'최신':`<b>${d}</b> 기록`)+(D&&D.T?' · 업데이트 '+Object.entries(D.T).map(([k,t])=>`${k} <b>${t}</b>`).join(' / '):'');
  const M=collect(D,!!(D&&D.prevDate));const Z=collect(ZZ,false);
  const all=[...M.values()];const zz=[...Z.values()];
  const byP={};for(const o of all.concat(zz))(byP[o.plat]??=[]).push(o);
  const nHits=all.reduce((s,o)=>s+o.hits.length,0);const top10=all.filter(o=>o.best<=10).length;
  const best=all.slice().sort((a,b)=>a.best-b.best)[0];
  const newIn=all.filter(o=>o.hits.some(h=>h.prev===null)).length;
  const who=ST.b==='all'?'로브로브·레세터':ST.b==='lov'?'로브로브':'레세터';
  $('take').innerHTML=`<b>${d}</b> · ${who} 상품이 여성 일간 랭킹(무신사·W컨셉·29CM) TOP100 안에 든 기록 · 상품 <b>${all.length}</b>개 · 리스트 <b>${nHits}</b>곳`;
  $('kpis').innerHTML=[
    ['순위권 상품',all.length+'개',PL_ORDER.filter(p=>p!=='지그재그').map(p=>`${p} ${(byP[p]||[]).length}`).join(' · ')],
    ['오른 리스트',nHits+'곳','카테고리·세부 리스트 합계'],
    ['TOP10 상품',top10+'개','어느 리스트든 10위 안'],
    ['최고 순위',best?best.best+'위':'–',best?`${best.plat} ${best.hits[0].lab} · ${best.p[1].replace(/\[[^\]]*\]\s*/g,'').slice(0,18)}`:''],
    ['새로 진입',D&&D.prevDate?newIn+'개':'–',D&&D.prevDate?`${D.prevDate}엔 없던 리스트에 등장`:'비교할 전날 기록 없음']
  ].map(([l,val,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${esc(val)}</div><div class="s">${esc(s)}</div></div>`).join('');
  let h='';
  for(const pl of PL_ORDER){const a=(byP[pl]||[]).sort((x,y)=>x.best-y.best||y.hits.length-x.hits.length);if(!a.length)continue;
    h+=`<div class="plat">${pl}${pl==='지그재그'&&ZZ?` · ${ZZ.date} 스냅샷`:''} · ${a.length}개</div><div class="items">${a.map(item).join('')}</div>`}
  $('list').innerHTML=h||`<div class="empty">이 날은 ${who} 상품이 순위권에 없어요.</div>`;
  hist();
}
async function hist(){
  const ds=DATES.slice(-14);const files=await Promise.all(ds.map(x=>get('rankday_'+x+'.json')));
  const rows=new Map();
  files.forEach((D,i)=>{for(const o of collect(D,false).values()){const r=rows.get(o.pid)||{o,cell:{}};r.o=o;r.cell[ds[i]]=o;rows.set(o.pid,r)}});
  const R=[...rows.values()].sort((a,b)=>PL_ORDER.indexOf(a.o.plat)-PL_ORDER.indexOf(b.o.plat)||Object.keys(b.cell).length-Object.keys(a.cell).length||Math.min(...Object.values(a.cell).map(x=>x.best))-Math.min(...Object.values(b.cell).map(x=>x.best)));
  if(!R.length){$('hist').innerHTML='<div class="empty">기록이 없어요.</div>';return}
  const cls=n=>n<=10?'h1':n<=50?'h2':'h3';
  $('hist').innerHTML=`<table><thead><tr><th class="n">상품</th><th>플랫폼</th>${ds.map(x=>`<th>${+x.slice(5,7)}/${+x.slice(8)}</th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr><td class="n">${esc(r.o.p[1].replace(/\[[^\]]*\]\s*/g,''))}<small>${esc(r.o.p[0])}</small></td><td>${esc(r.o.plat)}</td>${ds.map(x=>{const c=r.cell[x];return `<td>${c?`<span class="c ${cls(c.best)}" title="${esc(c.hits[0].lab)} · ${c.hits.length}곳">${c.best}</span>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
}
$('brand').onclick=e=>{const b=e.target.closest('[data-b]');if(b){ST.b=b.dataset.b;render()}};
$('dpick').onchange=e=>{ST.date=e.target.value||LD;render()};
$('dprev').onclick=()=>{const i=DATES.indexOf(ST.used);if(i>0){ST.date=DATES[i-1];render()}};
$('dnext').onclick=()=>{const i=DATES.indexOf(ST.used);if(i<DATES.length-1){ST.date=DATES[i+1];render()}};
$('dlatest').onclick=()=>{ST.date=LD;render()};
render();
})();
</script>
</body></html>
