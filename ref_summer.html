<title>여름 레퍼런스 보드</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1c1a17; --sub:#8a8578; --line:#e5e1d8;
  --accent:#b23b3b; --heart:#c9557f; --pill:#ffffff; --pillon:#1c1a17;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px 80px}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,242,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1280px;margin:0 auto;padding:16px 22px 12px}
.htitle{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hsub{font-size:12px;color:var(--sub);margin-top:3px}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{font-size:12.5px;font-weight:700;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--pill);color:#55514a;cursor:pointer;transition:.13s;white-space:nowrap}
.pill:hover{border-color:#b8b2a5}
.pill.on{background:var(--pillon);color:#fff;border-color:var(--pillon)}
section.cat{padding-top:34px;scroll-margin-top:118px}
.chead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.chead h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.chead .cnt{font-size:12px;color:var(--sub)}
.cnote{font-size:12px;color:var(--sub);margin:0 0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px 15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.14s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(40,34,26,.13);border-color:#d8d2c6}
.thumb{position:relative;width:100%;aspect-ratio:3/4;background:#eceae4;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:9px;top:9px;background:rgba(28,26,23,.82);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.02em}
.heart{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.9);color:var(--heart);font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px}
.info{padding:11px 12px 13px}
.brand{font-size:11px;font-weight:800;color:#8a8578;letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.name{font-size:12.5px;line-height:1.35;font-weight:600;color:#2a2823;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prow{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
.final{font-size:14px;font-weight:800}
.dc{font-size:12px;font-weight:800;color:var(--accent)}
.orig{font-size:11px;color:#b3ada0;text-decoration:line-through}
.meta{font-size:11px;color:var(--sub);margin-top:6px}
.foot{text-align:center;color:var(--sub);font-size:11.5px;margin-top:50px;line-height:1.7}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px 11px}.htitle{font-size:17px}}
</style>

const won=n=>"₩"+(n||0).toLocaleString('en-US');
const hk=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k':(n||0);
const imgUrl=id=>IMG[id]?("https://product-image.wconcept.co.kr/productimg/image/"+IMG[id]+".jpg?RS=500"):"";
const purl=id=>"https://www.wconcept.co.kr/Product/"+id;

function cardHTML(p){
  return '<a class="card" href="'+purl(p.id)+'" target="_blank" rel="noopener">'+
    '<div class="thumb">'+
      (p.dc?'<span class="badge">'+p.dc+'%</span>':'')+
      (p.heart>0?'<span class="heart">♥ '+hk(p.heart)+'</span>':'')+
      '<img loading="lazy" src="'+imgUrl(p.id)+'" alt="'+p.name.replace(/"/g,'')+'">'+
    '</div>'+
    '<div class="info">'+
      '<div class="brand">'+p.brand+'</div>'+
      '<div class="name">'+p.name+'</div>'+
      '<div class="prow"><span class="final">'+won(p.final)+'</span>'+(p.dc?'<span class="dc">'+p.dc+'%</span>':'')+(p.cust&&p.cust!=p.final?'<span class="orig">'+won(p.cust)+'</span>':'')+'</div>'+
      '<div class="meta">관심 ♥ '+(p.heart||0).toLocaleString()+'</div>'+
    '</div>'+
  '</a>';
}

function render(){
  var v=document.getElementById('views'); v.innerHTML='';
  CATS.forEach(function(cat){
    var items=D.filter(function(p){return p.cat===cat;});
    if(!items.length)return;
    var brands=[...new Set(items.map(function(p){return p.brand;}))];
    var sec=document.createElement('section'); sec.className='cat'; sec.id='c_'+CATS.indexOf(cat);
    sec.innerHTML='<div class="chead"><h2>'+cat+'</h2><span class="cnt">'+items.length+'개 · '+brands.join(' · ')+'</span></div>'+
      '<p class="cnote">브랜드 서칭 결과 · 관심수 높은 순</p>'+
      '<div class="grid">'+items.map(cardHTML).join('')+'</div>';
    v.appendChild(sec);
  });
  document.getElementById('foot').innerHTML='총 '+D.length+'개 상품 · '+CATS.length+'개 카테고리 · W컨셉 수집<br>썸네일/가격/관심수는 수집 시점(2026.09.02) 기준 — 시점에 따라 변동될 수 있어요';
}
function buildNav(){
  var nav=document.getElementById('nav');
  nav.innerHTML=CATS.map(function(cat,i){var n=D.filter(function(p){return p.cat===cat;}).length;return '<span class="pill" data-i="'+i+'">'+cat+' <b style="opacity:.5">'+n+'</b></span>';}).join('');
  nav.querySelectorAll('.pill').forEach(function(el){el.onclick=function(){var t=document.getElementById('c_'+el.dataset.i);if(t)t.scrollIntoView({behavior:'smooth'});};});
}
render(); buildNav();
// scrollspy
var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=e.target.id.split('_')[1];document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('on',p.dataset.i===i);});}});},{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section.cat').forEach(function(s){obs.observe(s);});
